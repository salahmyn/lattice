  <text x="132" y="69" font-family="Geist, 'Geist Sans', ui-sans-serif, system-ui, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="500" letter-spacing="0.18em" fill="#E2E6EE" textLength="300" lengthAdjust="spacingAndGlyphs">LATTICE</text>
