<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block map</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5d6779; --line: #dfe3ea; --soft: #eef1f5;
  --accent: #2f5fd0; --accent-soft: #e5ecfb; --wired: #1f8a5b; --warn: #b4690e;
  --v0: #c2412d; --v1: #b4690e; --v2: #2f5fd0; --v3: #11836f; --v4: #7a8496;
  --k-system: #3657c9; --k-external: #687284; --k-actor: #a3368f; --k-ui: #0b7f8c;
  --k-api: #2e7d32; --k-action: #a95400; --k-data: #7048bf; --k-rule: #c0392b;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1a1e26; --ink: #e4e8ef; --muted: #98a2b3; --line: #2c323d; --soft: #222833;
    --accent: #7ea2ff; --accent-soft: #24304a; --wired: #4cc38a; --warn: #e3a34a;
    --v0: #ef7a66; --v1: #e3a34a; --v2: #7ea2ff; --v3: #4cc3a8; --v4: #8d97a8; color-scheme: dark;
    --k-system: #8aa4ff; --k-external: #a7afbd; --k-actor: #e584d4; --k-ui: #4fc9d4;
    --k-api: #72c97e; --k-action: #f0a35a; --k-data: #b59af2; --k-rule: #f08374;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1a1e26; --ink: #e4e8ef; --muted: #98a2b3; --line: #2c323d; --soft: #222833;
  --accent: #7ea2ff; --accent-soft: #24304a; --wired: #4cc38a; --warn: #e3a34a;
  --v0: #ef7a66; --v1: #e3a34a; --v2: #7ea2ff; --v3: #4cc3a8; --v4: #8d97a8; color-scheme: dark;
  --k-system: #8aa4ff; --k-external: #a7afbd; --k-actor: #e584d4; --k-ui: #4fc9d4;
  --k-api: #72c97e; --k-action: #f0a35a; --k-data: #b59af2; --k-rule: #f08374;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
.count { color: var(--muted); }
.stamps { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--soft); white-space: nowrap; font-size: 12px; }
.chip b { font-weight: 600; }
.chip .st { color: var(--muted); }
.chip.ok .st { color: var(--wired); } .chip.warn .st { color: var(--warn); }
.tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
input, select, button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
button:disabled { opacity: .45; cursor: default; }
input[type=search] { width: 240px; max-width: 60vw; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
main { flex: 1; display: grid; grid-template-columns: 320px 1fr 380px; min-height: 0; }
main:has(#pane.wide) { grid-template-columns: 1fr; position: relative; }
main:has(#pane.wide) #tree { display: none; }
main.tree-on:has(#pane.wide) { grid-template-columns: 280px 1fr; }
main.tree-on:has(#pane.wide) #tree { display: block; }
main:has(#pane.wide) #detail { position: absolute; right: 12px; top: 12px; bottom: 12px; width: min(400px, calc(100% - 24px)); z-index: 5; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 28px rgb(0 0 0 / .14); }
main:has(#pane.wide) #detail.none { display: none; }
#detail .close { float: right; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; }
.dbar .seg { display: inline-flex; align-items: center; gap: 2px; color: var(--muted); }
.dbar .seg button { min-width: 26px; }
.dbar button.on, .dbar button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
svg text.lane { font: 600 11px var(--sans); letter-spacing: .08em; fill: var(--muted); }
.bx text.ck { font: 600 10.5px var(--mono); letter-spacing: .05em; fill: var(--wired); }
.bx text.tt { font: 600 12.5px var(--sans); fill: var(--ink); }
.bx text.td { font: 11px var(--sans); fill: var(--muted); }
svg text.el { font: 10px var(--mono); fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; pointer-events: none; }
.bx rect.badge { fill: var(--soft); stroke: var(--warn); }
.bx rect.badge.ok, g > rect.badge.ok { stroke: var(--wired); }
rect.badge { fill: var(--soft); stroke: var(--warn); }
text.bt { font: 600 10px var(--mono); fill: var(--ink); }
rect.bar { fill: var(--soft); stroke: var(--line); stroke-width: .5; }
rect.bar.on { fill: var(--wired); stroke: none; }
section { min-height: 0; overflow: auto; }
#tree { background: var(--panel); border-right: 1px solid var(--line); padding: 6px 0; }
#detail { background: var(--panel); border-left: 1px solid var(--line); padding: 14px 16px; }
.row { display: flex; align-items: center; gap: 6px; padding: 2px 10px 2px 0; cursor: pointer; white-space: nowrap; }
.row:hover { background: var(--soft); }
.row.sel { background: var(--accent-soft); }
.caret { width: 14px; flex: none; text-align: center; color: var(--muted); font-size: 10px; }
.kind { flex: none; display: inline-flex; align-items: center; gap: 3px; font: 10.5px var(--mono); color: var(--muted); background: var(--soft); border-radius: 4px; padding: 0 4px; }
.t { overflow: hidden; text-overflow: ellipsis; }
.n { color: var(--muted); font-size: 11px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.wired { color: var(--wired); font-size: 11px; flex: none; }
.gl { flex: none; vertical-align: -2px; overflow: visible; }
.gl *, svg .gl * { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.gl .fill, svg .gl .fill { fill: currentColor; }
.center { display: flex; flex-direction: column; min-width: 0; }
.tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 10px; color: var(--muted); cursor: pointer; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
#pane { flex: 1; overflow: auto; padding: 12px; }
svg text { fill: var(--ink); font: 12px var(--sans); }
svg .k { fill: var(--muted); font: 10.5px var(--mono); }
svg path { fill: none; stroke: var(--line); stroke-width: 1.4; }
svg .lbl { fill: var(--muted); font: 10px var(--mono); }
.empty { color: var(--muted); padding: 24px; }
h2 { font-size: 16px; margin: 0 0 4px; }
.id { font: 11.5px var(--mono); color: var(--muted); word-break: break-all; }
.crumbs { margin: 6px 0; color: var(--muted); font-size: 12px; }
.crumbs a, .link { color: var(--accent); cursor: pointer; text-decoration: none; }
.crumbs b { color: var(--ink); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.acts button { padding: 2px 8px; cursor: pointer; font-size: 12px; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
table { border-collapse: collapse; width: 100%; }
td { border-top: 1px solid var(--line); padding: 4px 6px 4px 0; vertical-align: top; word-break: break-word; }
td.key { color: var(--muted); width: 32%; font: 11.5px var(--mono); }
.verdict { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.case { border-top: 1px solid var(--line); padding: 6px 0; }
.case .cls { font: 11px var(--mono); }
.flows { display: grid; grid-template-columns: 240px 1fr; gap: 12px; }
.flist .row { padding: 6px 8px; border-radius: 6px; }
.steps { counter-reset: s; list-style: none; margin: 0; padding: 0; }
.steps li { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-top: 1px solid var(--line); }
.steps li::before { counter-increment: s; content: counter(s); width: 24px; flex: none; color: var(--muted); text-align: right; font: 11px var(--mono); }
.sk { flex: none; font: 10.5px var(--mono); padding: 0 5px; border-radius: 4px; background: var(--soft); }
.sk.api, .sk.reply { color: var(--accent); } .sk.loop { color: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 6px 12px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .lt { font: 600 10.5px var(--sans); text-transform: uppercase; letter-spacing: .06em; }
#pane.diag, #pane.focus { padding: 0; overflow: hidden; position: relative; }
.dbar { position: absolute; left: 0; right: 0; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 12px; background: color-mix(in srgb, var(--bg) 88%, transparent); border-bottom: 1px solid var(--line); font-size: 12px; }
.dbar .crumbs { margin: 0; }
.dbar button { padding: 2px 8px; cursor: pointer; }
.dbar select { padding: 2px 6px; }
.dbar label { display: inline-flex; gap: 3px; align-items: center; color: var(--muted); cursor: pointer; }
details.kinds { position: relative; font-size: 12px; }
details.kinds summary { cursor: pointer; color: var(--muted); }
details.kinds label { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); cursor: pointer; }
details.kinds .sw { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
details.kinds > div { position: absolute; top: 22px; left: 0; z-index: 3; display: grid; gap: 4px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px rgb(0 0 0 / .12); white-space: nowrap; }
.dbar .play { color: var(--ink); font-weight: 600; }
.fsearch { position: relative; }
.fsearch input { width: 200px; padding: 2px 8px; }
.fqr { position: absolute; top: 26px; left: 0; z-index: 4; min-width: 280px; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px rgb(0 0 0 / .14); padding: 4px 0; }
.fqr .row { padding: 4px 10px; }
#dsvg, #fsvg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#dsvg.drag, #fsvg.drag { cursor: grabbing; }
.bx rect.c { fill: var(--soft); stroke: var(--line); }
.bx text.ct { font: 600 12px var(--sans); fill: var(--muted); }
.bx rect.l { fill: var(--panel); stroke: var(--line); }
.bx rect.l.out, .bx rect.l.more { fill: var(--bg); stroke-dasharray: 4 3; }
.bx { cursor: pointer; }
.bx:hover rect.l, .bx:hover rect.c { stroke: var(--accent); }
.bx.sel rect.l, .bx.sel rect.c { stroke: var(--accent); stroke-width: 2; }
.bx.cur rect.l, .bx.cur rect.c { stroke: var(--warn); stroke-width: 2.5; }
.bx.seen rect.l { fill: var(--accent-soft); }
.bx .tg { fill: var(--muted); font: 11px var(--mono); }
path.e { fill: none; stroke: var(--muted); stroke-opacity: .45; stroke-width: 1.2; }
path.e.hot { stroke: var(--accent); stroke-opacity: 1; }
path.e.walk { stroke: var(--warn); stroke-opacity: 1; stroke-width: 2.5; }
.fc { cursor: pointer; outline: none; }
.fc rect.b { fill: var(--panel); stroke: var(--line); }
.fc:hover rect.b, .fc:focus-visible rect.b { stroke: var(--accent); stroke-width: 1.5; }
.fc.me rect.b { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.fc.sel rect.b { stroke: var(--accent); stroke-width: 2; }
.fc text.t { font: 600 12.5px var(--sans); fill: var(--ink); }
.fc.me text.t { font-size: 14px; }
.fc text.s { font: 11px var(--sans); fill: var(--muted); }
.fc text.kk { font: 600 10px var(--mono); letter-spacing: .05em; }
.fc text.cnt { font: 10.5px var(--mono); fill: var(--muted); }
.fmore rect { fill: var(--bg); stroke: var(--line); stroke-dasharray: 4 3; }
.fmore text { font: 11px var(--sans); fill: var(--muted); }
svg text.colh { font: 600 10.5px var(--sans); letter-spacing: .08em; fill: var(--muted); }
path.fe { fill: none; stroke: var(--muted); stroke-opacity: .5; }
path.fe.hot { stroke: var(--accent); stroke-opacity: 1; }
.disc { max-width: 100%; }
.dhead { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 8px; }
.dhead input { width: 320px; }
.facets { display: grid; gap: 4px; margin: 4px 0 10px; }
.facet { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.facet > b { width: 64px; flex: none; font: 600 10.5px var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.fchip { cursor: pointer; padding: 1px 8px; }
.fchip.on { background: var(--accent-soft); border-color: var(--accent); }
table.dt { font-size: 12.5px; }
table.dt th { position: sticky; top: -12px; background: var(--panel); text-align: left; font: 600 11px var(--sans); color: var(--muted); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; user-select: none; }
table.dt th.num, table.dt td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.dt td { padding: 5px 10px 5px 0; vertical-align: middle; }
table.dt tr[data-row] { cursor: pointer; }
table.dt tr[data-row]:hover td, table.dt tr[data-row]:focus-visible td { background: var(--soft); }
table.dt td .id { font-size: 10.5px; }
.bdg { display: inline-flex; align-items: center; gap: 4px; font: 10.5px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--soft); white-space: nowrap; }
.unowned { color: var(--muted); font-style: italic; }
.legend button.lk { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 999px; font-size: 12px; color: var(--ink); cursor: pointer; }
.legend button.lk .st { color: var(--muted); font: 11px var(--mono); }
.legend button.lk.off { opacity: .5; text-decoration: line-through; }
.ctool { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 3; display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 18px rgb(0 0 0 / .14); font-size: 12px; white-space: nowrap; }
.ctool button { border: 0; background: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; color: var(--muted); min-width: 28px; }
.ctool button:hover { background: var(--soft); color: var(--ink); }
.ctool button.on, .ctool button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); }
.ctool .zp { min-width: 46px; text-align: center; color: var(--muted); font: 11px var(--mono); }
.ctool .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.ctool .menu { position: relative; }
.ctool .menu > div { position: absolute; bottom: 34px; right: 0; display: grid; min-width: 150px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px rgb(0 0 0 / .14); }
.ctool .menu > div button { text-align: left; color: var(--ink); }
svg.mini { position: absolute; right: 14px; bottom: 14px; z-index: 3; width: 200px; height: 140px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px rgb(0 0 0 / .12); cursor: crosshair; }
svg.mini rect.mc { fill: none; stroke: var(--line); }
svg.mini rect.ml { stroke: none; opacity: .55; }
svg.mini rect.mv { fill: var(--accent); fill-opacity: .08; stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.textview { position: absolute; inset: 0; z-index: 4; background: var(--bg); padding: 56px 16px 70px; overflow: auto; }
.textview .th { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; color: var(--muted); }
.textview pre { margin: 0; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font: 12px/1.5 var(--mono); white-space: pre; overflow: auto; }
.walk { position: absolute; left: 14px; bottom: 64px; z-index: 3; width: min(380px, calc(100% - 28px)); max-height: calc(100% - 140px); overflow: auto; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px rgb(0 0 0 / .16); font-size: 12.5px; }
.walk .wh { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; }
.walk .wh b { color: var(--ink); }
.walk .wh button { margin-left: 0; padding: 1px 7px; cursor: pointer; }
.walk .wh .sp { flex: 1; }
.walk .prog { height: 3px; border-radius: 2px; background: var(--soft); margin: 6px 0 8px; overflow: hidden; }
.walk .prog i { display: block; height: 100%; background: var(--warn); }
.walk .wt { font-weight: 650; font-size: 14px; margin: 2px 0; display: flex; gap: 6px; align-items: center; }
.walk .ways { margin: 8px 0 4px; display: grid; gap: 3px; }
.walk .ways button { text-align: left; padding: 3px 8px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.walk .ways button.taken { border-color: var(--warn); }
.walk .ways kbd, .walk kbd { font: 10.5px var(--mono); padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; background: var(--soft); }
.walk .past { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
.walk .past a { font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--soft); color: var(--muted); cursor: pointer; }
.walk .past a.now { background: var(--accent-soft); color: var(--ink); }
.lanes { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin: 8px 0 12px; }
.lanes svg { display: block; }
.lanes rect.band { fill: var(--soft); }
.lanes rect.band.alt { fill: var(--bg); }
.lanes rect.gbox { fill: var(--accent-soft); fill-opacity: .45; stroke: var(--accent); stroke-opacity: .5; stroke-dasharray: 5 3; }
.lanes text.ln { font: 600 10.5px var(--sans); letter-spacing: .06em; fill: var(--muted); }
.lanes .sc { cursor: pointer; }
.lanes .sc rect.b { fill: var(--panel); stroke: var(--line); }
.lanes .sc:hover rect.b { stroke: var(--accent); }
.lanes .sc text.t { font: 600 11.5px var(--sans); fill: var(--ink); }
.lanes .sc text.k { font: 10px var(--mono); }
.lanes .sc text.i { font: 10px var(--mono); fill: var(--muted); }
.lanes path.st { fill: none; stroke: var(--muted); stroke-opacity: .6; stroke-width: 1.3; }
.lanes path.st.rt { stroke-dasharray: 4 3; stroke: var(--accent); }
.lpick { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--muted); font-size: 12px; }
.lpick button { padding: 1px 8px; cursor: pointer; font-size: 12px; }
.lpick button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.cmenu { position: fixed; z-index: 20; display: grid; min-width: 180px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 22px rgb(0 0 0 / .18); font-size: 12.5px; }
.cmenu .ch { padding: 4px 8px; color: var(--muted); font-size: 11px; border-bottom: 1px solid var(--line); margin-bottom: 2px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmenu button { border: 0; background: none; text-align: left; padding: 5px 8px; border-radius: 5px; cursor: pointer; }
.cmenu button:hover, .cmenu button:focus-visible { background: var(--soft); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30; padding: 6px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 12px; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-auto-rows: minmax(260px, auto); overflow: auto; }
  #tree, #detail { border: 0; border-bottom: 1px solid var(--line); max-height: 45vh; }
  .flows { grid-template-columns: 1fr; }
  .tools { margin-left: 0; }
}
</style>
</head>
<body>
<header>
  <h1>Block map <span class="count" id="counts"></span></h1>
  <div class="stamps" id="stamps"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Search blocks ( / )" aria-label="Search blocks">
    <select id="init" aria-label="Proposal overlay"><option value="">No proposal</option></select>
  </div>
</header>
<main>
  <section id="tree" aria-label="Blocks"></section>
  <section class="center">
    <div class="tabs" role="tablist">
      <button class="on" data-tab="diag" role="tab">Diagram</button>
      <button data-tab="focus" role="tab">Focus</button>
      <button data-tab="flows" role="tab">Flows</button>
      <button data-tab="discover" role="tab">Discover</button>
    </div>
    <div class="legend" id="legend" hidden></div>
    <div class="legend" id="klegend" hidden></div>
    <div id="pane"></div>
  </section>
  <section id="detail" aria-label="Block details"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js" integrity="sha384-KO35c6PFq7tFxAEx6FtATwL9vOBOmCzQYr7GM0iTr3oO22s7Jc9OkclOH4AV7jwK" crossorigin="anonymous"></script>
<script id="graph" type="application/json">/*__GRAPH__*/</script>
<script>
(async function () {
  const inline = document.getElementById("graph").textContent.trim();
  let G;
  try {
    G = inline ? JSON.parse(inline) : await fetch("api/graph" + location.search).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  } catch (e) {
    document.getElementById("pane").innerHTML = `<p class="empty">Could not load the block graph (${esc(String(e))}). Run <code>lattice refresh</code>.</p>`;
    return;
  }
  const blocks = G.blocks || [], edges = G.block_edges || [], flows = G.flows || [], sources = G.sources || [];
  const byId = new Map(blocks.map(b => [b.id, b]));
  const kids = new Map(), outE = new Map(), inE = new Map();
  for (const b of blocks) {
    const p = b.parent && byId.has(b.parent) ? b.parent : "";
    if (!kids.has(p)) kids.set(p, []);
    kids.get(p).push(b.id);
  }
  for (const list of kids.values()) list.sort((a, b) => title(a).localeCompare(title(b)));
  for (const e of edges) {
    (outE.get(e.from) || outE.set(e.from, []).get(e.from)).push(e);
    (inE.get(e.to) || inE.set(e.to, []).get(e.to)).push(e);
  }
  const inits = blocks.filter(b => b.initiative && b.id === "init:" + b.initiative);
  // sel: the block in the detail panel; focus: the block in the middle of the Focus tab, with its history
  const S = { sel: "", cluster: "", init: "", tab: "diag", flow: flows.length ? flows[0].id : "", open: new Set([""]), treeOn: false,
    focus: "", hops: 1, ctx: false, lens: "containment", hist: [], hi: -1,
    hide: new Set(), mini: true, text: false, lanes: "system", lmode: "lanes" }; // hide: kinds the legend turned off
  const rank = {}; // verdict -> rank in the selected initiative's class order

  function title(id) { const b = byId.get(id); return b ? (b.title || b.id) : id; }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function trunc(s, n) { s = String(s ?? ""); return s.length > n ? s.slice(0, Math.max(1, n - 1)) + "…" : s; }
  function visible(id) { const b = byId.get(id); return b && (!b.initiative || b.initiative === S.init); }
  function vcolor(v) { const r = rank[v]; return r === undefined ? "var(--v4)" : `var(--v${Math.min(r, 4)})`; }
  function ov(b) { return S.init && b.overlays ? b.overlays[S.init] : null; }
  function anc(id) { // ancestors, nearest first; stops at a parent cycle
    const out = [];
    for (let p = byId.get(id)?.parent; p && byId.has(p) && p !== id && !out.includes(p); p = byId.get(p).parent) out.push(p);
    return out;
  }
  function shown(id) { return visible(id) && !S.hide.has(byId.get(id).kind); } // visible, and its kind not hidden in the legend
  function kidsV(id) { return (kids.get(id) || []).filter(shown); }
  function hideKey() { return [...S.hide].sort().join(","); }

  // ---- kinds: a colour and a glyph per kind family; unknown kinds keep the hash colour and a plain dot
  const FAMS = [
    { id: "system", label: "System / container", re: /^(system|container|area|group|composite|module|package|domain|subsystem|service|app|application)$/ },
    { id: "external", label: "External", re: /^external/ },
    { id: "actor", label: "Actor / agent", re: /^(actor|agent|user|persona|person|role)$/ },
    { id: "ui", label: "Screen / page / UI", re: /^(screen|page|ui|view|component|modal|dialog|form|widget)$/ },
    { id: "api", label: "API / endpoint / route", re: /^(api|endpoint|route|controller|boundary-in|boundary-out|webhook|consumer|producer|grpc|http)$/ },
    { id: "action", label: "Action / step", re: /^(action|step|task|job|handler|process|command|operation)$/ },
    { id: "data", label: "Data / config / setting", re: /^(data|config|configuration|setting|settings|model|store|table|database|db|cache|queue|event|record|index|schema)$/ },
    { id: "rule", label: "Invariant / rule", re: /^(invariant|rule|policy|guard|validation|constraint|check)$/ },
  ];
  const GLYPH = {
    system: '<rect x="1.5" y="1.5" width="11" height="11" rx="2"/><path d="M1.5 5h11"/>',
    external: '<rect x="1.5" y="1.5" width="11" height="11" rx="2" stroke-dasharray="2.2 1.6"/><path d="M5.5 8.5 9.5 4.5M6.5 4.5h3v3"/>',
    actor: '<circle cx="7" cy="4.4" r="2.6"/><path d="M2 12.8c.4-2.8 2.4-4.6 5-4.6s4.6 1.8 5 4.6"/>',
    ui: '<rect x="1.5" y="2.5" width="11" height="9" rx="1.5"/><path d="M1.5 5.5h11M4 8.5h4"/>',
    api: '<path d="M5 3.5 1.8 7 5 10.5M9 3.5 12.2 7 9 10.5"/>',
    action: '<path class="fill" d="M4.2 2.6v8.8l7-4.4z"/>',
    data: '<ellipse cx="7" cy="3.6" rx="5" ry="2"/><path d="M2 3.6v6.8c0 1.1 2.2 2 5 2s5-.9 5-2V3.6M2 7c0 1.1 2.2 2 5 2s5-.9 5-2"/>',
    rule: '<path d="M7 1.4 12 3.3v3.6c0 3-2.1 4.9-5 5.7-2.9-.8-5-2.7-5-5.7V3.3z"/><path d="M4.8 7.1 6.4 8.6 9.3 5.6"/>',
    cluster: '<rect x="1.5" y="1.5" width="4.5" height="4.5" rx="1"/><rect x="8" y="1.5" width="4.5" height="4.5" rx="1"/><rect x="1.5" y="8" width="4.5" height="4.5" rx="1"/><rect x="8" y="8" width="4.5" height="4.5" rx="1"/>',
    other: '<circle cx="7" cy="7" r="4.4"/>',
  };
  const famMemo = new Map();
  function famOf(kind) {
    if (!famMemo.has(kind)) famMemo.set(kind, (FAMS.find(f => f.re.test(kind || "")) || { id: "" }).id);
    return famMemo.get(kind);
  }
  function kindColor(k) { let h = 0; for (const c of k) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 55% 48%)`; }
  function kcolor(kind) { const f = famOf(kind); return f ? `var(--k-${f})` : kindColor(kind || "?"); }
  function gColor(kind, fam, color) { return color || (fam && FAMS.some(f => f.id === fam) ? `var(--k-${fam})` : kcolor(kind)); }
  function gHtml(kind, fam, color) { // the glyph as an inline icon
    return `<svg class="gl" viewBox="0 0 14 14" width="13" height="13" aria-hidden="true" style="color:${gColor(kind, fam, color)}">${GLYPH[fam || famOf(kind) || "other"]}</svg>`;
  }
  function gSvg(kind, x, y, s, fam, color) { // the glyph inside an svg, s px wide at (x, y)
    return `<g class="gl" transform="translate(${x},${y}) scale(${s / 14})" style="color:${gColor(kind, fam, color)}">${GLYPH[fam || famOf(kind) || "other"]}</g>`;
  }
  function kindBadge(kind) { return `<span class="kind" style="color:${kcolor(kind)}">${gHtml(kind)}${esc(kind)}</span>`; }
  function renderKinds(kinds) { // the legend: each kind on screen with its icon and count (group boundaries left out);
    const el = document.getElementById("klegend"); // a click hides or shows that kind everywhere but the tree
    const n = new Map();
    for (const k of kinds) if (k) n.set(k, (n.get(k) || 0) + 1);
    for (const k of S.hide) if (!n.has(k)) n.set(k, 0); // a hidden kind stays listed, so it can come back
    if (!n.size) { el.hidden = true; return; }
    el.hidden = false;
    const order = k => { const i = FAMS.findIndex(f => f.id === famOf(k)); return i < 0 ? FAMS.length : i; };
    const ks = [...n.keys()].sort((a, b) => order(a) - order(b) || n.get(b) - n.get(a) || a.localeCompare(b));
    el.innerHTML = `<span class="lt">Kinds</span>` + ks.map(k => {
      const f = FAMS.find(x => x.id === famOf(k)), off = S.hide.has(k);
      return `<button class="lk${off ? " off" : ""}" data-hide="${esc(k)}" aria-pressed="${!off}" title="${esc(f ? f.label : "no family: hash colour")} · click to ${off ? "show" : "hide"}">${gHtml(k)}${esc(k)} <span class="st">${n.get(k)}</span></button>`;
    }).join("") + (S.hide.size ? `<button class="lk" data-hide="" title="Show every kind">show all</button>` : "");
  }
  document.getElementById("klegend").onclick = e => {
    const b = e.target.closest("[data-hide]");
    if (!b) return;
    const k = b.dataset.hide;
    if (!k) S.hide.clear(); else S.hide.has(k) ? S.hide.delete(k) : S.hide.add(k);
    kindsChanged(); commit(true);
  };
  function kindsChanged() { D.key = ""; F.key = ""; DR.key = ""; if (S.tab === "flows") renderPane(); else if (S.tab === "discover") renderDiscover(false); else renderPane(); }

  // ---- what each block belongs to: its system (or external), owner and tier, from itself or its nearest ancestor
  const memo = { ctx: new Map(), owner: new Map(), tier: new Map() };
  function up(id, pick, m) {
    if (m.has(id)) return m.get(id);
    let v = "";
    for (const x of [id, ...anc(id)]) { v = pick(byId.get(x)); if (v) break; }
    m.set(id, v);
    return v;
  }
  function isCtx(b) { return b.kind === "system" || /^external/.test(b.kind); }
  function ctxOf(id) { // the nearest system or external, else the block's system field, else its outermost ancestor
    if (memo.ctx.has(id)) return memo.ctx.get(id);
    const chain = [id, ...anc(id)], b = byId.get(id);
    let r = chain.find(x => isCtx(byId.get(x)));
    if (!r) r = b.system && byId.has(b.system) ? b.system : chain[chain.length - 1];
    memo.ctx.set(id, r);
    return r;
  }
  function ownerOf(id) { return up(id, b => b.attrs?.owner || "", memo.owner); }
  function tierOf(id) { return up(id, b => b.tier || "", memo.tier); }
  const flowsOf = new Map(); // block -> the flows that step on it
  for (const f of flows) for (const s of f.steps) { const l = flowsOf.get(s.to) || flowsOf.set(s.to, []).get(s.to); if (!l.includes(f)) l.push(f); }

  document.getElementById("counts").textContent = `${blocks.length} blocks · ${edges.length} edges · ${flows.length} flows`;
  document.getElementById("stamps").innerHTML = sources.map(s => {
    const st = s.state === "behind" ? `behind ${s.behind}` : s.state === "ahead" ? `ahead ${s.ahead}` : (s.state || "");
    const cls = s.state === "current" || s.state === "snapshot" ? "ok" : s.state ? "warn" : "";
    return `<span class="chip ${cls}" title="${esc(s.repo || "")} ${esc(s.commit || "")}"><b>${esc(s.id)}</b> ${esc((s.commit || "").slice(0, 7))} <span class="st">${esc(st)}</span></span>`;
  }).join("");
  const sel = document.getElementById("init");
  for (const b of inits) sel.insertAdjacentHTML("beforeend", `<option value="${esc(b.initiative)}">${esc(b.title)} (${esc(b.attrs?.status || "")})</option>`);
  if (!inits.length) sel.hidden = true;
  function setInit(v) {
    S.init = inits.some(b => b.initiative === v) ? v : "";
    sel.value = S.init;
    for (const k in rank) delete rank[k];
    const sys = byId.get("init:" + S.init);
    (sys?.attrs?.verdicts || "").split(" · ").forEach((p, i) => { if (p) rank[p.split(" ")[0]] = i; });
    if (!S.init && S.lens === "verdict") S.lens = "containment";
    if (S.sel && !visible(S.sel)) S.sel = "";
    if (S.focus && !visible(S.focus)) S.focus = "";
    D.key = ""; F.key = "";
  }
  sel.onchange = () => { setInit(sel.value); renderLegend(); renderTree(); renderPane(); renderDetail(); commit(true); };

  function renderLegend() {
    const el = document.getElementById("legend");
    const sys = byId.get("init:" + S.init);
    if (!sys) { el.hidden = true; return; }
    const titles = {};
    for (const b of blocks) { const o = ov(b); if (o) titles[o.verdict] = o.title || o.verdict; }
    el.hidden = false;
    el.innerHTML = `<span class="lt">Verdicts</span>` + Object.keys(titles).sort((a, b) => (rank[a] ?? 9) - (rank[b] ?? 9))
      .map(v => `<span><i class="dot" style="background:${vcolor(v)}"></i>${esc(titles[v])}</span>`).join("") +
      `<span>· ${esc(sys.attrs?.gaps || 0)} gaps, blocking: ${esc(sys.attrs?.blocking || "none")}</span>`;
  }

  // ---- tree
  const treeEl = document.getElementById("tree"), qEl = document.getElementById("q");
  function row(id, depth) {
    const b = byId.get(id), ch = (kids.get(id) || []).filter(visible), o = ov(b);
    const on = id === (S.tab === "focus" ? S.focus : S.sel);
    return `<div class="row${on ? " sel" : ""}" data-id="${esc(id)}" style="padding-left:${8 + depth * 14}px">` +
      `<span class="caret" data-toggle="${esc(id)}">${ch.length ? (S.open.has(id) ? "▾" : "▸") : ""}</span>` +
      (o ? `<i class="dot" style="background:${vcolor(o.verdict)}" title="${esc(o.title)}"></i>` : "") +
      kindBadge(b.kind) + `<span class="t">${esc(b.title || b.id)}</span>` +
      (b.truth === "wired" ? `<span class="wired" title="wired: ${esc(b.attrs?.wired_by || "")}">✓</span>` : "") +
      (ch.length ? `<span class="n">${ch.length}</span>` : "") + `</div>`;
  }
  function subtree(id, depth, out) {
    for (const c of (kids.get(id) || []).filter(visible)) {
      out.push(row(c, depth));
      if (S.open.has(c)) subtree(c, depth + 1, out);
    }
  }
  function matches(q, limit) {
    const terms = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return [];
    const hits = [];
    for (const b of blocks) {
      if (!visible(b.id)) continue;
      const hay = (b.id + " " + b.title + " " + (b.description || "")).toLowerCase();
      if (terms.every(t => hay.includes(t))) { hits.push(b); if (limit && hits.length >= limit) break; }
    }
    return hits;
  }
  function renderTree() {
    const q = qEl.value.trim();
    const out = [];
    if (q) {
      const hits = matches(q);
      for (const b of hits.slice(0, 300)) out.push(row(b.id, 0));
      out.unshift(`<div class="row n" style="padding-left:10px">${hits.length} match${hits.length === 1 ? "" : "es"}${hits.length > 300 ? ", first 300" : ""}</div>`);
    } else subtree("", 0, out);
    treeEl.innerHTML = out.join("");
  }
  treeEl.onclick = e => {
    const t = e.target.closest("[data-toggle]");
    if (t && t.textContent) { const id = t.dataset.toggle; S.open.has(id) ? S.open.delete(id) : S.open.add(id); renderTree(); return; }
    const r = e.target.closest("[data-id]");
    if (r) select(r.dataset.id);
  };
  qEl.oninput = () => { if (S.tab !== "flows" && qEl.value && !S.treeOn) setTreeOn(true); renderTree(); };
  qEl.onkeydown = e => {
    if (e.key !== "Enter") return;
    const hit = matches(qEl.value, 1)[0];
    if (hit) select(hit.id);
  };

  function select(id) { // a block picked in the tree, the search or a link: show it in the current tab and its details
    if (!byId.has(id)) return;
    S.sel = id; S.cluster = "";
    for (const p of anc(id)) S.open.add(p);
    if (S.tab === "focus") { focusOn(id); return; }
    renderTree(); renderDetail();
    if (S.tab === "diag") reveal(id);
    else if (S.tab === "flows") renderPane();
    const r = treeEl.querySelector(".row.sel");
    if (r && !qEl.value) r.scrollIntoView({ block: "nearest" });
    commit(false);
  }
  function openDetail(id) { if (!byId.has(id)) return; S.sel = id; S.cluster = ""; renderTree(); renderDetail(); if (S.tab === "focus") fmarks(); }
  function setTreeOn(on) {
    S.treeOn = on;
    document.querySelector("main").classList.toggle("tree-on", S.treeOn);
    document.querySelectorAll("[data-act=tree]").forEach(b => b.setAttribute("aria-pressed", String(S.treeOn)));
    setTimeout(() => { if (S.tab === "diag") fit(); if (S.tab === "focus") ffit(false); }, 0);
  }

  // ---- center
  function setTab(tab, push = true) {
    S.tab = tab; S.cluster = ""; D.menuOpen = false; S.text = false;
    document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x.dataset.tab === tab));
    renderPane(); renderTree(); renderDetail();
    commit(push);
  }
  document.querySelector(".tabs").onclick = e => { const b = e.target.closest("[data-tab]"); if (b) setTab(b.dataset.tab); };
  const pane = document.getElementById("pane");
  pane.onclick = e => {
    if (e.target.closest("#ctool, #tview")) return toolClick(e);
    if (e.target.closest("#walk")) return walkClick(e);
    if (S.tab === "diag" || S.tab === "focus") return; // the canvases handle their own clicks
    const ln = e.target.closest("[data-lanes], [data-lmode]");
    if (ln) { if (ln.dataset.lanes) S.lanes = ln.dataset.lanes; if (ln.dataset.lmode) S.lmode = ln.dataset.lmode; renderPane(); commit(false); return; }
    if (S.tab === "discover") return discoverClick(e);
    const c = e.target.closest("[data-id]");
    if (c) { select(c.dataset.id); return; }
    const f = e.target.closest("[data-flow]");
    if (f) { S.flow = f.dataset.flow; renderPane(); commit(false); return; }
    const pl = e.target.closest("[data-play]");
    if (pl) startPlay(pl.dataset.play);
  };
  function renderPane() {
    pane.className = { diag: "wide diag", focus: "wide focus", discover: "wide disc" }[S.tab] || "";
    if (S.tab !== "diag") D.drawn = false;
    if (S.tab === "diag") return renderDiagram();
    if (S.tab === "focus") return renderFocus();
    if (S.tab === "discover") return renderDiscover(true);
    renderFlows();
  }

  function edgeMenu() { // the edge-kind filter every view shares
    return `<details class="kinds"${D.menuOpen ? " open" : ""}><summary>Edges${D.off.size ? ` (${edgeKinds.length - D.off.size} of ${edgeKinds.length})` : ""}</summary><div>` +
      edgeKinds.map(k => `<label><input type="checkbox" data-kind="${esc(k)}"${D.off.has(k) ? "" : " checked"}><i class="sw" style="background:${kindColor(k)}"></i>${esc(k)}</label>`).join("") + `</div></details>`;
  }
  function edgeMenuToggle(el) { el.addEventListener("toggle", e => { if (e.target.matches("details.kinds")) D.menuOpen = e.target.open; }, true); }
  function kindsText(g, max = 2) { // "3× api, flow +1"
    const ks = Object.entries(g.kinds).sort((a, b) => b[1] - a[1]);
    return ks.slice(0, max).map(([k, n]) => (n > 1 ? n + "× " : "") + k.replace(/_/g, " ")).join(", ") + (ks.length > max ? ` +${ks.length - max}` : "");
  }
  function strokeW(n, base) { return Math.min(base + Math.log2(n) * 0.9, base + 4).toFixed(2); }

  // ---- focus: the block in the centre, what reaches it on the left, what it reaches on the right
  const F = { tf: { k: 1, x: 0, y: 0 }, size: null, key: "", adj: null, tap: 0, boxes: new Map(), center: "" };
  const MAXC = 40, FW = 216, FH = 62, CW = 264, CH = 86, FGX = 120, FGY = 14;
  function focusGraph() { // edges as Focus draws them: filtered, visible, lifted to systems in context mode, merged per pair
    const key = [S.ctx, S.init, [...D.off].sort().join(","), hideKey()].join("|");
    if (F.key === key && F.adj) return F.adj;
    const node = id => !shown(id) ? null : S.ctx ? (shown(ctxOf(id)) ? ctxOf(id) : null) : id;
    const agg = new Map(), out = new Map(), inn = new Map();
    for (const e of edges) {
      if (D.off.has(e.kind)) continue;
      const a = node(e.from), b = node(e.to);
      if (!a || !b || a === b) continue;
      const k = a + "\u0000" + b;
      let g = agg.get(k);
      if (!g) {
        g = { from: a, to: b, kinds: {}, n: 0, labels: [] };
        agg.set(k, g);
        (out.get(a) || out.set(a, []).get(a)).push(g);
        (inn.get(b) || inn.set(b, []).get(b)).push(g);
      }
      g.kinds[e.kind] = (g.kinds[e.kind] || 0) + 1; g.n++;
      const l = e.labels?.[0];
      if (l && g.labels.length < 3 && !g.labels.includes(l)) g.labels.push(l);
    }
    F.key = key; F.adj = { out, inn, node };
    return F.adj;
  }
  function topKind(g) { return Object.entries(g.kinds).sort((a, b) => b[1] - a[1])[0][0]; }
  function columns(c, adj, side) { // one column per hop, outward; a block sits in the nearest column of its side
    const cols = [], placed = new Set([c]);
    let prev = [c];
    for (let h = 1; h <= S.hops && prev.length; h++) {
      const seen = new Map();
      prev.forEach((p, i) => {
        for (const g of (side === "out" ? adj.out : adj.inn).get(p) || []) {
          const id = side === "out" ? g.to : g.from;
          if (placed.has(id)) continue;
          const s = seen.get(id);
          if (s) { s.sum += i; s.n++; } else seen.set(id, { sum: i, n: 1, kind: topKind(g) });
        }
      });
      const ids = [...seen.keys()].sort((a, b) => {
        const x = seen.get(a), y = seen.get(b);
        return (h === 1 ? x.kind.localeCompare(y.kind) : x.sum / x.n - y.sum / y.n) || title(a).localeCompare(title(b));
      });
      if (!ids.length) break;
      for (const id of ids) placed.add(id);
      const shown = ids.slice(0, MAXC);
      cols.push({ ids: shown, more: ids.length - shown.length });
      prev = shown;
    }
    return cols;
  }
  function pickFocus() {
    if (S.sel && visible(S.sel)) return S.sel;
    const sys = blocks.filter(b => b.kind === "system" && visible(b.id)).sort((a, b) => title(a.id).localeCompare(title(b.id)))[0];
    return sys ? sys.id : (blocks.find(b => visible(b.id)) || {}).id || "";
  }
  function focusOn(id, push = true) { // re-centre; history keeps the walk for back and forward
    if (!byId.has(id)) return;
    if (id !== S.focus) {
      S.hist = S.hist.slice(0, S.hi + 1);

  function project() {

  const LW = 250, lh = () => S.init ? 118 : 102; // a last line holds verdict counts when a proposal is on

          `<text class="tt" x="${b.x + 12}" y="${b.y + 40}">${esc(n.title)} blocks</text><text class="td" x="${b.x + 12}" y="${b.y + 58}">fewer links than the ones shown</text></g>`;

      const nIn = inside.get(real) || 0, s = stampOf.get(real), sc = statusIn.get(real), par = blk.parent && byId.get(blk.parent), owner = ownerOf(real);

        `<rect class="l${out ? " out" : ""}" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="9"/>` +
        `<rect x="${b.x + 9}" y="${b.y}" width="${b.w - 18}" height="3" rx="1.5" style="fill:${kcolor(blk.kind)}"/>` +
        (o ? `<rect x="${b.x}" y="${b.y}" width="5" height="${b.h}" rx="2" style="fill:${vcolor(o.verdict)}"/>` : "") +

    const tl = wrap(g.label, Math.floor((b.w - 28) / 7.4), 2);
    let y = b.y + 16, s = `<g class="bx" data-box="${esc(n.id)}"><title>${esc(LENSES[S.lens])}: ${esc(g.label)} · ${g.ids.length} blocks · click for the list, double-click to open</title>` +
      `<rect class="l" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="9"/><rect x="${b.x + 9}" y="${b.y}" width="${b.w - 18}" height="3" rx="1.5" style="fill:${look.color}"/>` +
      gSvg(look.kind, b.x + 12, b.y + 7, 11, look.fam, look.color) + `<text class="tg" x="${b.x + 28}" y="${y}">${esc(LENSES[S.lens].toLowerCase())}</text>`;

  function curve(p) { // ELK spline sections: start, (control, control, end)*; anything else as a polyline

  function marks() {

    const k = Math.min((r.width - 40) / (D.size.w || 1), (r.height - top - 20) / (D.size.h || 1), 1.2);
    D.tf = { k, x: (r.width - D.size.w * k) / 2, y: top + Math.max(0, (r.height - top - D.size.h * k) / 2) };

  function setLens(v) {

  function wire() {

  // ---- walkthrough: a flow stepped on the diagram. ←/→ step, 1–9 take a way on at a fork (leaving the recorded

  function startPlay(id) {
    const f = flows.find(x => x.id === id && x.steps.length);
    if (!f) return;
    P.flow = f; P.i = 0;
    P.path = f.steps.filter(s => byId.has(s.to)).map(s => ({ to: s.to, kind: s.kind, label: s.label || "", when: s.when || [] }));
    if (!P.path.length) { P.flow = null; return; }

  }
  function waysOn() { // where the walk can go from this step: the recorded next step first, then the block's other links

    if (!rec || rec.to !== w.to) { P.path = P.path.slice(0, P.i + 1); P.path.push({ to: w.to, kind: w.kind, label: w.label, when: w.when, off: true }); }

  function renderWalk() {

    const attrs = Object.entries(b.attrs || {});
    if (attrs.length) h += `<h3>Attributes</h3><table>` + attrs.map(([k, v]) => `<tr><td class="key">${esc(k)}</td><td>${esc(v)}</td></tr>`).join("") + `</table>`;
    h += `<h3>Provenance</h3><div class="id">${esc(b.provenance?.kind)} ${esc(b.provenance?.source || "")}</div>`;
    const ch = (kids.get(b.id) || []).filter(visible);
    if (ch.length) h += `<h3>Contains (${ch.length})</h3>` + ch.slice(0, 60).map(c => `<div>${gHtml(byId.get(c).kind)} <a class="link" data-id="${esc(c)}">${esc(title(c))}</a> <span class="n">${esc(byId.get(c).kind)}</span></div>`).join("") +
      (ch.length > 60 ? `<div class="n">+${ch.length - 60} more</div>` : "");
    detail.innerHTML = h;
  }
  function renderClusterDetail(c) {
    const look = grpLook(c);
    const ks = Object.entries(c.kinds).sort((a, b) => b[1] - a[1]);
    detail.innerHTML = `<button class="close" data-close aria-label="Close the details">✕</button><h2>${gHtml(look.kind, look.fam, look.color)} ${esc(c.label)}</h2>` +
      `<div class="id">${esc(LENSES[S.lens])} · ${c.ids.length} blocks</div>` +
      (S.lens === "owner" && c.key === "~" ? `<p class="n">These blocks have no <code>owner</code> attribute on themselves or above. Set <code>owner:</code> on a system, external or group judgment entry; feature blocks take their manifest's owners.</p>` : "") +
      `<h3>Kinds</h3><div class="chips">${ks.map(([k, n]) => `<span class="chip">${gHtml(k)}${esc(k)} <span class="st">${n}</span></span>`).join("")}</div>` +
      `<h3>Blocks</h3>` + c.ids.slice(0, 80).map(id => `<div>${gHtml(byId.get(id).kind)} <a class="link" data-id="${esc(id)}">${esc(title(id))}</a> <span class="n">${esc(byId.get(id).kind)}</span></div>`).join("") +
      (c.ids.length > 80 ? `<div class="n">+${c.ids.length - 80} more: filter Discover for the rest</div>` : "");
  }

  // ---- deep links: #tab=focus&id=<block>&hops=2&lens=system&ctx=1 (and root, init, flow); the back button walks them
  const TABS = ["diag", "focus", "flows", "discover"];
  let lastHash = null;
  function hashOf() {
    const p = new URLSearchParams();
    p.set("tab", S.tab);
    const id = S.tab === "focus" ? S.focus : S.sel;
    if (id) p.set("id", id);
    if (S.hops !== 1) p.set("hops", String(S.hops));
    if (S.lens !== "containment") p.set("lens", S.lens);
    if (S.ctx) p.set("ctx", "1");
    if (D.root) p.set("root", D.root);
    if (S.init) p.set("init", S.init);
    if (S.tab === "flows" && S.flow) p.set("flow", S.flow);
    if (S.tab === "flows" && S.lanes !== "system") p.set("lanes", S.lanes);
    if (S.hide.size) p.set("hide", hideKey());
    return p.toString();
  }
  function commit(push) {
    const h = hashOf();
    if (h === location.hash.slice(1)) return;
    lastHash = h;
    try { history[push ? "pushState" : "replaceState"](null, "", "#" + h); }
    catch { if (push) location.hash = h; else location.replace("#" + h); }
  }
  function applyHash(force) {
    const raw = location.hash.slice(1);
    if (!force && raw === lastHash) return;
    lastHash = raw;
    const p = new URLSearchParams(raw), t = p.get("tab");
    const tab = TABS.includes(t) ? t : t === "rel" ? "focus" : force ? "diag" : S.tab;
    const init = p.get("init") || "";
    if (init !== S.init) { setInit(init); renderLegend(); }
    S.hops = Math.min(3, Math.max(1, parseInt(p.get("hops"), 10) || 1));
    const ctx = p.get("ctx") === "1";
    if (ctx !== S.ctx) { S.ctx = ctx; F.key = ""; }
    const lens = LENSES[p.get("lens")] && (p.get("lens") !== "verdict" || S.init) ? p.get("lens") : "containment";
    if (lens !== S.lens) { S.lens = lens; D.lexp = new Set(); D.lpin = new Set(); S.cluster = ""; }
    const root = byId.has(p.get("root")) ? p.get("root") : "";
    if (root !== D.root) { D.root = root; D.exp = new Set(); D.depth = 0; if (!root) insideTo(1); }
    if (flows.some(f => f.id === p.get("flow"))) S.flow = p.get("flow");
    if (tab === "flows") S.lanes = LANEBY[p.get("lanes")] ? p.get("lanes") : "system";
    const hide = (p.get("hide") || "").split(",").filter(Boolean).sort().join(",");
    if (hide !== hideKey()) { S.hide = new Set(hide.split(",").filter(Boolean)); D.key = ""; F.key = ""; DR.key = ""; }
    const id = byId.has(p.get("id")) && visible(p.get("id")) ? p.get("id") : "";
    S.tab = tab;
    document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x.dataset.tab === tab));
    if (tab === "focus") {
      if (id && id !== S.focus) { // the back button walks the focus history too
        if (S.hist[S.hi - 1] === id) S.hi--;
        else if (S.hist[S.hi + 1] === id) S.hi++;
        else { S.hist = S.hist.slice(0, S.hi + 1); S.hist.push(id); S.hi = S.hist.length - 1; }
        S.focus = id;
      }
    } else {
      S.sel = id; S.cluster = "";
      if (id) for (const a of anc(id)) S.open.add(a);
    }
    renderPane(); renderTree(); renderDetail();
    if (tab === "diag" && id) reveal(id);
  }
  window.addEventListener("popstate", () => applyHash(false));
  window.addEventListener("hashchange", () => applyHash(false));

  // ---- keyboard: / search, Esc close, and in Focus [ ] history, 1 2 3 hops, c system context, f fit
  // walkthrough: ← → 1–9 Esc; canvases: + - zoom, m minimap, t text; Flows: g groups the steps
  document.addEventListener("keydown", e => {
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName);
    if (e.key === "Escape") {
      if (typing) { e.target.blur(); return; }
      if (!cm.hidden) { cm.hidden = true; return; }
      const xm = document.getElementById("xmenu");
      if (xm && !xm.hidden) { xm.hidden = true; return; }
      if (S.text) { S.text = false; textView(); return; }
      if (P.flow && S.tab === "diag") { stopPlay(); return; }
      if (S.sel || S.cluster) { S.sel = ""; S.cluster = ""; renderTree(); renderDetail(); marks(); fmarks(); commit(false); }
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (P.flow && S.tab === "diag") {
      if (e.key === "ArrowRight") { e.preventDefault(); nextStep(); return; }
      if (e.key === "ArrowLeft") { e.preventDefault(); prevStep(); return; }
      if (/^[1-9]$/.test(e.key) && +e.key <= waysOn().length) { nextStep(+e.key - 1); return; }
    }
    if (e.key === "/") { e.preventDefault(); if (S.tab === "focus") document.getElementById("fq")?.focus(); else qEl.focus(); return; }
    if (S.tab === "flows" && e.key.toLowerCase() === "g") { const ks = Object.keys(LANEBY); S.lanes = ks[(ks.indexOf(S.lanes) + 1) % ks.length]; renderPane(); commit(false); return; }
    if (S.tab === "diag" || S.tab === "focus") {
      if (e.key === "f") { S.tab === "focus" ? ffit(true) : fit(); return; }
      if (e.key === "+" || e.key === "=") { zoomBy(1.25); return; }
      if (e.key === "-") { zoomBy(0.8); return; }
      if (e.key === "m") { setMini(!S.mini); return; }
      if (e.key === "t") { S.text = !S.text; textView(); return; }
    }
    if (S.tab !== "focus") return;
    if (e.key === "[") histGo(-1);
    else if (e.key === "]") histGo(1);
    else if (/^[123]$/.test(e.key)) setHops(+e.key);
    else if (e.key === "c") setCtx(!S.ctx);
  });

  let rz = 0;
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (S.tab === "focus") ffit(false); }, 150); });
  insideTo(1);
  applyHash(true); // draws the tab the link names (the diagram by default)
  commit(false);
})();
</script>
</body>
</html>
