<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block map</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5d6779; --line: #dfe3ea; --soft: #eef1f5;
  --accent: #2f5fd0; --accent-soft: #e5ecfb; --wired: #1f8a5b; --warn: #b4690e;
  --v0: #c2412d; --v1: #b4690e; --v2: #2f5fd0; --v3: #11836f; --v4: #7a8496;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1a1e26; --ink: #e4e8ef; --muted: #98a2b3; --line: #2c323d; --soft: #222833;
    --accent: #7ea2ff; --accent-soft: #24304a; --wired: #4cc38a; --warn: #e3a34a;
    --v0: #ef7a66; --v1: #e3a34a; --v2: #7ea2ff; --v3: #4cc3a8; --v4: #8d97a8;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1a1e26; --ink: #e4e8ef; --muted: #98a2b3; --line: #2c323d; --soft: #222833;
  --accent: #7ea2ff; --accent-soft: #24304a; --wired: #4cc38a; --warn: #e3a34a;
  --v0: #ef7a66; --v1: #e3a34a; --v2: #7ea2ff; --v3: #4cc3a8; --v4: #8d97a8;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
.count { color: var(--muted); }
.stamps { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--soft); white-space: nowrap; font-size: 12px; }
.chip b { font-weight: 600; }
.chip .st { color: var(--muted); }
.chip.ok .st { color: var(--wired); } .chip.warn .st { color: var(--warn); }
.tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
input, select, button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
input[type=search] { width: 240px; max-width: 60vw; }
main { flex: 1; display: grid; grid-template-columns: 320px 1fr 380px; min-height: 0; }
main:has(#pane.diag) { grid-template-columns: 260px 1fr 320px; }
section { min-height: 0; overflow: auto; }
#tree { background: var(--panel); border-right: 1px solid var(--line); padding: 6px 0; }
#detail { background: var(--panel); border-left: 1px solid var(--line); padding: 14px 16px; }
.row { display: flex; align-items: center; gap: 6px; padding: 2px 10px 2px 0; cursor: pointer; white-space: nowrap; }
.row:hover { background: var(--soft); }
.row.sel { background: var(--accent-soft); }
.caret { width: 14px; flex: none; text-align: center; color: var(--muted); font-size: 10px; }
.kind { flex: none; font: 10.5px var(--mono); color: var(--muted); background: var(--soft); border-radius: 4px; padding: 0 4px; }
.t { overflow: hidden; text-overflow: ellipsis; }
.n { color: var(--muted); font-size: 11px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.wired { color: var(--wired); font-size: 11px; flex: none; }
.center { display: flex; flex-direction: column; min-width: 0; }
.tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 10px; color: var(--muted); cursor: pointer; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
#pane { flex: 1; overflow: auto; padding: 12px; }
svg text { fill: var(--ink); font: 12px var(--sans); }
svg .k { fill: var(--muted); font: 10.5px var(--mono); }
svg .card rect { fill: var(--panel); stroke: var(--line); }
svg .card { cursor: pointer; }
svg .card:hover rect { stroke: var(--accent); }
svg .me rect { fill: var(--accent-soft); stroke: var(--accent); }
svg path { fill: none; stroke: var(--line); stroke-width: 1.4; }
svg .lbl { fill: var(--muted); font: 10px var(--mono); }
.empty { color: var(--muted); padding: 24px; }
h2 { font-size: 16px; margin: 0 0 4px; }
.id { font: 11.5px var(--mono); color: var(--muted); word-break: break-all; }
.crumbs { margin: 6px 0; color: var(--muted); font-size: 12px; }
.crumbs a, .link { color: var(--accent); cursor: pointer; text-decoration: none; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
table { border-collapse: collapse; width: 100%; }
td { border-top: 1px solid var(--line); padding: 4px 6px 4px 0; vertical-align: top; word-break: break-word; }
td.key { color: var(--muted); width: 32%; font: 11.5px var(--mono); }
.verdict { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.case { border-top: 1px solid var(--line); padding: 6px 0; }
.case .cls { font: 11px var(--mono); }
.flows { display: grid; grid-template-columns: 240px 1fr; gap: 12px; }
.flist .row { padding: 6px 8px; border-radius: 6px; }
.steps { counter-reset: s; list-style: none; margin: 0; padding: 0; }
.steps li { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-top: 1px solid var(--line); }
.steps li::before { counter-increment: s; content: counter(s); width: 24px; flex: none; color: var(--muted); text-align: right; font: 11px var(--mono); }
.sk { flex: none; font: 10.5px var(--mono); padding: 0 5px; border-radius: 4px; background: var(--soft); }
.sk.api, .sk.reply { color: var(--accent); } .sk.loop { color: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; padding: 8px 12px; color: var(--muted); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
#pane.diag { padding: 0; overflow: hidden; position: relative; }
.dbar { position: absolute; left: 0; right: 0; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 12px; background: color-mix(in srgb, var(--bg) 88%, transparent); border-bottom: 1px solid var(--line); font-size: 12px; }
.dbar .crumbs { margin: 0; }
.dbar button { padding: 2px 8px; cursor: pointer; }
.dbar label { display: inline-flex; gap: 3px; align-items: center; color: var(--muted); cursor: pointer; }
.dbar details.kinds { position: relative; }
.dbar details.kinds summary { cursor: pointer; color: var(--muted); }
.dbar details.kinds > div { position: absolute; top: 22px; left: 0; z-index: 3; display: grid; gap: 4px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px rgb(0 0 0 / .12); white-space: nowrap; }
.dbar .play { color: var(--ink); font-weight: 600; }
#dsvg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#dsvg.drag { cursor: grabbing; }
.bx rect.c { fill: var(--soft); stroke: var(--line); }
.bx text.ct { font: 600 12px var(--sans); fill: var(--muted); }
.bx rect.l { fill: var(--panel); stroke: var(--line); }
.bx rect.l.out { fill: var(--bg); stroke-dasharray: 4 3; }
.bx { cursor: pointer; }
.bx:hover rect.l, .bx:hover rect.c { stroke: var(--accent); }
.bx.sel rect.l, .bx.sel rect.c { stroke: var(--accent); stroke-width: 2; }
.bx.cur rect.l, .bx.cur rect.c { stroke: var(--warn); stroke-width: 2.5; }
.bx.seen rect.l { fill: var(--accent-soft); }
.bx .tg { fill: var(--muted); font: 11px var(--mono); }
path.e { fill: none; stroke: var(--muted); stroke-opacity: .45; stroke-width: 1.2; }
path.e.hot { stroke: var(--accent); stroke-opacity: 1; stroke-width: 2; }
path.e.walk { stroke: var(--warn); stroke-opacity: 1; stroke-width: 2.5; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-auto-rows: minmax(260px, auto); overflow: auto; }
  #tree, #detail { border: 0; border-bottom: 1px solid var(--line); max-height: 45vh; }
  .flows { grid-template-columns: 1fr; }
  .tools { margin-left: 0; }
}
</style>
</head>
<body>
<header>
  <h1>Block map <span class="count" id="counts"></span></h1>
  <div class="stamps" id="stamps"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Search blocks" aria-label="Search blocks">
    <select id="init" aria-label="Proposal overlay"><option value="">No proposal</option></select>
  </div>
</header>
<main>
  <section id="tree" aria-label="Blocks"></section>
  <section class="center">
    <div class="tabs" role="tablist">
      <button class="on" data-tab="diag" role="tab">Diagram</button>
      <button data-tab="rel" role="tab">Relations</button>
      <button data-tab="flows" role="tab">Flows</button>
    </div>
    <div class="legend" id="legend" hidden></div>
    <div id="pane"></div>
  </section>
  <section id="detail" aria-label="Block details"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
<script id="graph" type="application/json">/*__GRAPH__*/</script>
<script>
(async function () {
  const inline = document.getElementById("graph").textContent.trim();
  let G;
  try {
    G = inline ? JSON.parse(inline) : await fetch("api/graph").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  } catch (e) {
    document.getElementById("pane").innerHTML = `<p class="empty">Could not load the block graph (${esc(String(e))}). Run <code>lattice refresh</code>.</p>`;
    return;
  }
  const blocks = G.blocks || [], edges = G.block_edges || [], flows = G.flows || [], sources = G.sources || [];
  const byId = new Map(blocks.map(b => [b.id, b]));
  const kids = new Map(), outE = new Map(), inE = new Map();
  for (const b of blocks) {
    const p = b.parent && byId.has(b.parent) ? b.parent : "";
    if (!kids.has(p)) kids.set(p, []);
    kids.get(p).push(b.id);
  }
  for (const list of kids.values()) list.sort((a, b) => title(a).localeCompare(title(b)));
  for (const e of edges) {
    (outE.get(e.from) || outE.set(e.from, []).get(e.from)).push(e);
    (inE.get(e.to) || inE.set(e.to, []).get(e.to)).push(e);
  }
  const inits = blocks.filter(b => b.initiative && b.id === "init:" + b.initiative);
  const S = { sel: "", init: "", tab: "diag", flow: flows.length ? flows[0].id : "", open: new Set([""]) };
  const rank = {}; // verdict -> rank in the selected initiative's class order

  function title(id) { const b = byId.get(id); return b ? (b.title || b.id) : id; }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function visible(id) { const b = byId.get(id); return b && (!b.initiative || b.initiative === S.init); }
  function vcolor(v) { const r = rank[v]; return r === undefined ? "var(--v4)" : `var(--v${Math.min(r, 4)})`; }
  function ov(b) { return S.init && b.overlays ? b.overlays[S.init] : null; }

  document.getElementById("counts").textContent = `${blocks.length} blocks · ${edges.length} edges · ${flows.length} flows`;
  document.getElementById("stamps").innerHTML = sources.map(s => {
    const st = s.state === "behind" ? `behind ${s.behind}` : s.state === "ahead" ? `ahead ${s.ahead}` : (s.state || "");
    const cls = s.state === "current" || s.state === "snapshot" ? "ok" : s.state ? "warn" : "";
    return `<span class="chip ${cls}" title="${esc(s.repo || "")} ${esc(s.commit || "")}"><b>${esc(s.id)}</b> ${esc((s.commit || "").slice(0, 7))} <span class="st">${esc(st)}</span></span>`;
  }).join("");
  const sel = document.getElementById("init");
  for (const b of inits) sel.insertAdjacentHTML("beforeend", `<option value="${esc(b.initiative)}">${esc(b.title)} (${esc(b.attrs?.status || "")})</option>`);
  if (!inits.length) sel.hidden = true;
  sel.onchange = () => {
    S.init = sel.value;
    for (const k in rank) delete rank[k];
    const sys = byId.get("init:" + S.init);
    (sys?.attrs?.verdicts || "").split(" · ").forEach((p, i) => { if (p) rank[p.split(" ")[0]] = i; });
    D.key = ""; renderLegend(); renderTree(); renderPane(); renderDetail();
  };

  function renderLegend() {
    const el = document.getElementById("legend");
    const sys = byId.get("init:" + S.init);
    if (!sys) { el.hidden = true; return; }
    const titles = {};
    for (const b of blocks) { const o = ov(b); if (o) titles[o.verdict] = o.title || o.verdict; }
    el.hidden = false;
    el.innerHTML = Object.keys(titles).sort((a, b) => (rank[a] ?? 9) - (rank[b] ?? 9))
      .map(v => `<span><i class="dot" style="background:${vcolor(v)}"></i>${esc(titles[v])}</span>`).join("") +
      `<span>· ${esc(sys.attrs?.gaps || 0)} gaps, blocking: ${esc(sys.attrs?.blocking || "none")}</span>`;
  }

  // ---- tree
  const treeEl = document.getElementById("tree"), qEl = document.getElementById("q");
  function row(id, depth) {
    const b = byId.get(id), ch = (kids.get(id) || []).filter(visible), o = ov(b);
    return `<div class="row${id === S.sel ? " sel" : ""}" data-id="${esc(id)}" style="padding-left:${8 + depth * 14}px">` +
      `<span class="caret" data-toggle="${esc(id)}">${ch.length ? (S.open.has(id) ? "▾" : "▸") : ""}</span>` +
      (o ? `<i class="dot" style="background:${vcolor(o.verdict)}" title="${esc(o.title)}"></i>` : "") +
      `<span class="kind">${esc(b.kind)}</span><span class="t">${esc(b.title || b.id)}</span>` +
      (b.truth === "wired" ? `<span class="wired" title="wired: ${esc(b.attrs?.wired_by || "")}">✓</span>` : "") +
      (ch.length ? `<span class="n">${ch.length}</span>` : "") + `</div>`;
  }
  function subtree(id, depth, out) {
    for (const c of (kids.get(id) || []).filter(visible)) {
      out.push(row(c, depth));
      if (S.open.has(c)) subtree(c, depth + 1, out);
    }
  }
  function renderTree() {
    const q = qEl.value.trim().toLowerCase();
    const out = [];
    if (q) {
      const terms = q.split(/\s+/);
      const hits = blocks.filter(b => visible(b.id) && terms.every(t => (b.id + " " + b.title + " " + (b.description || "")).toLowerCase().includes(t)));
      for (const b of hits.slice(0, 300)) out.push(row(b.id, 0));
      out.unshift(`<div class="row n" style="padding-left:10px">${hits.length} match${hits.length === 1 ? "" : "es"}${hits.length > 300 ? ", first 300" : ""}</div>`);
    } else subtree("", 0, out);
    treeEl.innerHTML = out.join("");
  }
  treeEl.onclick = e => {
    const t = e.target.closest("[data-toggle]");
    if (t && t.textContent) { const id = t.dataset.toggle; S.open.has(id) ? S.open.delete(id) : S.open.add(id); renderTree(); return; }
    const r = e.target.closest("[data-id]");
    if (r) select(r.dataset.id);
  };
  qEl.oninput = renderTree;

  function select(id) {
    if (!byId.has(id)) return;
    S.sel = id;
    for (let p = byId.get(id).parent; p && byId.has(p); p = byId.get(p).parent) S.open.add(p);
    renderTree(); S.tab === "diag" ? reveal(id) : renderPane(); renderDetail();
    const r = treeEl.querySelector(".row.sel");
    if (r && !qEl.value) r.scrollIntoView({ block: "nearest" });
  }

  // ---- center
  document.querySelector(".tabs").onclick = e => {
    const b = e.target.closest("[data-tab]");
    if (!b) return;
    S.tab = b.dataset.tab;
    document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
    renderPane();
  };
  const pane = document.getElementById("pane");
  pane.onclick = e => {
    if (S.tab === "diag") return; // the diagram handles its own clicks
    const c = e.target.closest("[data-id]");
    if (c) { select(c.dataset.id); return; }
    const f = e.target.closest("[data-flow]");
    if (f) { S.flow = f.dataset.flow; renderPane(); return; }
    const pl = e.target.closest("[data-play]");
    if (pl) startPlay(pl.dataset.play);
  };
  function renderPane() {
    pane.classList.toggle("diag", S.tab === "diag");
    if (S.tab === "diag") return renderDiagram();
    D.drawn = false;
    S.tab === "flows" ? renderFlows() : renderRelations();
  }

  function renderRelations() {
    if (!S.sel) { pane.innerHTML = `<p class="empty">Pick a block on the left to see what it connects to.</p>`; return; }
    const MAX = 30, H = 40, GAP = 10, W = Math.max(150, Math.min(230, Math.floor((pane.clientWidth - 24 - 160) / 3)));
    const ins = (inE.get(S.sel) || []).filter(e => visible(e.from)), outs = (outE.get(S.sel) || []).filter(e => visible(e.to));
    const L = ins.slice(0, MAX), R = outs.slice(0, MAX);
    const width = Math.max(pane.clientWidth - 24, 3 * W + 160), mid = width / 2, chars = Math.floor(W / 7.2);
    const rows = Math.max(L.length, R.length, 1), height = rows * (H + GAP) + 40;
    const cy = height / 2;
    const card = (id, x, y, me) => {
      const b = byId.get(id), o = ov(b), t = (b.title || b.id);
      return `<g class="card${me ? " me" : ""}" data-id="${esc(id)}" transform="translate(${x},${y})"><title>${esc(b.id)}</title>` +
        `<rect width="${W}" height="${H}" rx="7"/>` + (o ? `<rect width="4" height="${H}" rx="2" style="fill:${vcolor(o.verdict)};stroke:none"/>` : "") +
        `<text x="10" y="16">${esc(t.length > chars ? t.slice(0, chars - 1) + "…" : t)}</text>` +
        `<text class="k" x="10" y="31">${esc(b.kind)}${b.truth === "wired" ? " · wired" : ""}</text></g>`;
    };
    const col = (list, x, side) => list.map((e, i) => {
      const y = 20 + i * (H + GAP) + (rows - list.length) * (H + GAP) / 2;
      const id = side < 0 ? e.from : e.to;
      const x1 = side < 0 ? x + W : x, x2 = side < 0 ? mid - W / 2 : mid + W / 2, y1 = y + H / 2;
      const c = (x1 + x2) / 2, lx = side < 0 ? x1 + 6 : x1 - 6;
      return `<path d="M${x1},${y1} C${c},${y1} ${c},${cy} ${x2},${cy}"/>` +
        `<text class="lbl" x="${lx}" y="${y1 - 4}" text-anchor="${side < 0 ? "start" : "end"}">${esc(e.kind)}${esc(edgeLabel(e, Math.floor((mid - W / 2 - W - 30) / 6.5) - e.kind.length - 3))}</text>` + card(id, x, y, false);
    }).join("");
    const more = (n, x) => n > MAX ? `<text class="k" x="${x}" y="${height - 6}">+${n - MAX} more</text>` : "";
    pane.innerHTML = `<svg width="${width}" height="${height}" role="img" aria-label="Relations of ${esc(title(S.sel))}">` +
      col(L, 10, -1) + col(R, width - W - 10, 1) + card(S.sel, mid - W / 2, cy - H / 2, true) +
      more(ins.length, 10) + more(outs.length, width - W - 10) +
      (ins.length + outs.length === 0 ? `<text class="k" x="${mid}" y="${cy + 40}" text-anchor="middle">no edges</text>` : "") + `</svg>`;
  }

  function edgeLabel(e, room) {
    const l = e.labels?.[0] || "";
    if (!l || room < 4) return "";
    return " · " + (l.length > room ? l.slice(0, room - 1) + "…" : l);
  }

  function renderFlows() {
    if (!flows.length) { pane.innerHTML = `<p class="empty">No flows in this graph.</p>`; return; }
    const f = flows.find(x => x.id === S.flow) || flows[0];
    pane.innerHTML = `<div class="flows"><div class="flist">` + flows.map(x =>
      `<div class="row${x.id === f.id ? " sel" : ""}" data-flow="${esc(x.id)}"><span class="t">${esc(x.title || x.id)}</span><span class="n">${x.steps.length} · ${esc(x.end)}</span></div>`).join("") +
      `</div><div><h2>${esc(f.title || f.id)}</h2><p class="crumbs">${f.steps.length} steps · ${esc(f.end)} · <a class="link" data-play="${esc(f.id)}">play on the diagram</a></p>` +
      (Object.keys(f.facts || {}).length ? `<details class="crumbs"><summary>${Object.keys(f.facts).length} facts this walk assumed</summary>` +
        Object.entries(f.facts).map(([k, v]) => `<div><span class="id">${esc(k)}</span> ${esc(v)}</div>`).join("") + `</details>` : "") + `<ol class="steps">` +
      f.steps.map(s => `<li><span class="sk ${esc(s.kind)}">${esc(s.kind)}</span><span><a class="link" data-id="${esc(s.to)}">${esc(title(s.to))}</a>` +
        (s.label ? ` <span class="n">${esc(s.label)}</span>` : "") + (s.when?.length ? `<br><span class="n">when ${esc(s.when.join(" ∧ "))}</span>` : "") + `</span></li>`).join("") +
      `</ol></div></div>`;
  }

  // ---- diagram: boxes for the root's children, opened in place or drilled into; block edges are lifted to the
  // nearest box on screen and merged per (from, to, kind)
  const D = { root: "", exp: new Set(), off: new Set(), key: "", nodes: null, rep: null, boxes: new Map(), es: [], size: null, tf: { k: 1, x: 0, y: 0 }, drawn: false, run: 0, note: "", outside: false };
  const P = { flow: null, i: 0, timer: 0 }; // flow playback
  const edgeKinds = [...new Set(edges.map(e => e.kind))].sort();
  function anc(id) { const out = []; for (let p = byId.get(id)?.parent; p && byId.has(p); p = byId.get(p).parent) out.push(p); return out; }
  function kidsV(id) { return (kids.get(id) || []).filter(visible); }

  function project() {
    const nodes = new Map();
    const add = (id, parent) => {
      const open = D.exp.has(id) && kidsV(id).length > 0;
      nodes.set(id, { id, parent, open, title: title(id), kind: byId.get(id).kind });
      if (open) for (const c of kidsV(id)) add(c, id);
    };
    for (const c of kidsV(D.root)) add(c, "");
    const rootChain = D.root ? [D.root, ...anc(D.root)] : [];
    const rep = id => {
      if (!visible(id)) return null;
      const chain = [id, ...anc(id)];
      for (const a of chain) if (nodes.has(a)) return a;
      for (const x of chain) { // outside the root: the ancestor that sits beside the root's line
        const p = byId.get(x).parent || "";
        if (p === "" || rootChain.includes(p)) return rootChain.includes(x) ? null : "out:" + x;
      }
      return null;
    };
    const nests = (a, b) => { for (let n = nodes.get(b); n && n.parent; n = nodes.get(n.parent)) if (n.parent === a) return true; return false; };
    const agg = new Map();
    D.hidden = 0;
    for (const e of edges) {
      if (D.off.has(e.kind)) continue;
      const a = rep(e.from), b = rep(e.to);
      if (!a || !b || a === b || nests(a, b) || nests(b, a)) continue;
      if (!D.outside && (a.startsWith("out:") || b.startsWith("out:"))) { D.hidden++; continue; }
      for (const x of [a, b]) if (x.startsWith("out:") && !nodes.has(x)) // outside the root: a dashed box beside the others
        nodes.set(x, { id: x, parent: "", open: false, title: title(x.slice(4)), kind: byId.get(x.slice(4)).kind });
      const k = a + "\u0000" + b; // one line per pair of boxes; its kinds show on hover
      const g = agg.get(k) || agg.set(k, { from: a, to: b, kinds: {}, n: 0 }).get(k);
      g.kinds[e.kind] = (g.kinds[e.kind] || 0) + 1;
      g.n++;
    }
    return { nodes, es: [...agg.values()], rep };
  }

  function rollup(nodes) { // verdict counts of the judged blocks inside each box
    const r = new Map();
    if (!S.init) return r;
    for (const b of blocks) {
      const o = ov(b);
      if (!o) continue;
      for (const x of [b.id, ...anc(b.id)]) if (nodes.has(x)) { const m = r.get(x) || r.set(x, {}).get(x); m[o.verdict] = (m[o.verdict] || 0) + 1; }
    }
    return r;
  }

  const LW = 210, lh = () => S.init ? 70 : 54; // a third line holds verdict counts when a proposal is on
  async function layout(pr) {
    const elkNode = id => {
      const n = pr.nodes.get(id);
      if (!n.open) return { id, width: LW, height: lh() };
      return { id, layoutOptions: { "elk.padding": "[top=34,left=12,bottom=12,right=12]" },
        children: [...pr.nodes.values()].filter(c => c.parent === id).map(c => elkNode(c.id)) };
    };
    const top = [...pr.nodes.values()].filter(n => n.parent === "").map(n => elkNode(n.id));
    const boxes = new Map();
    D.note = window.ELK ? "" : "layout library not loaded (offline?): simple grid";
    if (window.ELK) {
      try {
        const res = await new ELK().layout({ id: "root", children: top,
          layoutOptions: { "elk.algorithm": "layered", "elk.direction": "RIGHT", "elk.hierarchyHandling": "INCLUDE_CHILDREN",
            "elk.layered.spacing.nodeNodeBetweenLayers": "60", "elk.spacing.nodeNode": "18", "elk.spacing.componentComponent": "40",
            "elk.edgeRouting": "SPLINES", "elk.layered.mergeEdges": "true" },
          edges: pr.es.map((e, i) => ({ id: "e" + i, sources: [e.from], targets: [e.to] })) });
        const walk = (n, ox, oy) => { for (const c of n.children || []) { boxes.set(c.id, { x: ox + c.x, y: oy + c.y, w: c.width, h: c.height }); walk(c, ox + c.x, oy + c.y); } };
        walk(res, 0, 0);
        const pts = new Map();
        for (const e of res.edges || []) {
          const o = e.container && e.container !== "root" ? boxes.get(e.container) : null;
          const ox = o ? o.x : 0, oy = o ? o.y : 0, sec = (e.sections || [])[0];
          if (sec) pts.set(e.id, [sec.startPoint, ...(sec.bendPoints || []), sec.endPoint].map(q => ({ x: q.x + ox, y: q.y + oy })));
        }
        return { boxes, pts, w: res.width, h: res.height };
      } catch (err) { D.note = "layout failed (" + err + "): simple grid"; boxes.clear(); }
    }
    let i = 0; // no ELK (an offline file): a grid of the boxes that are not open, straight edges
    const leaves = [...pr.nodes.values()].filter(n => !n.open), cols = Math.max(1, Math.ceil(Math.sqrt(leaves.length * 2)));
    for (const n of leaves) { boxes.set(n.id, { x: (i % cols) * (LW + 40), y: Math.floor(i / cols) * (lh() + 40), w: LW, h: lh() }); i++; }
    return { boxes, pts: new Map(), w: cols * (LW + 40), h: Math.ceil(leaves.length / cols) * (lh() + 40) };
  }

  async function renderDiagram() {
    const key = [D.root, [...D.exp].sort().join(","), [...D.off].sort().join(","), S.init, D.outside].join("|");
    if (key === D.key && D.drawn) { bar(); marks(); return; }
    D.key = key;
    const run = ++D.run;
    const pr = project();
    pane.innerHTML = `<div class="dbar" id="dbar"></div><svg id="dsvg" role="img" aria-label="Block diagram"><g id="vp"></g></svg>`;
    D.drawn = true;
    bar();
    const lay = await layout(pr);
    if (run !== D.run) return; // a newer layout started meanwhile
    D.nodes = pr.nodes; D.rep = pr.rep; D.boxes = lay.boxes; D.es = pr.es; D.size = lay;
    const roll = rollup(pr.nodes);
    const depth = id => { let d = 0; for (let n = pr.nodes.get(id); n && n.parent; n = pr.nodes.get(n.parent)) d++; return d; };
    const open = [...pr.nodes.values()].filter(n => n.open).sort((a, b) => depth(a.id) - depth(b.id));
    const leaf = [...pr.nodes.values()].filter(n => !n.open);
    let h = "";
    for (const n of open) {
      const b = lay.boxes.get(n.id); if (!b) continue;
      h += `<g class="bx" data-box="${esc(n.id)}"><rect class="c" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="10"/>` +
        `<text class="ct" x="${b.x + 12}" y="${b.y + 21}">▾ ${esc(n.title)}</text>` + rollSvg(roll.get(n.id), b.x + b.w - 12, b.y + 21) + `</g>`;
    }
    pr.es.forEach((e, i) => {
      const p = lay.pts.get("e" + i) || straight(lay.boxes.get(e.from), lay.boxes.get(e.to));
      if (!p) return;
      h += `<path class="e" data-e="${i}" d="${curve(p)}"><title>${esc(title(e.from.replace(/^out:/, "")))} → ${esc(title(e.to.replace(/^out:/, "")))}: ${Object.entries(e.kinds).map(([k, n]) => esc(k) + (n > 1 ? " ×" + n : "")).join(", ")}</title></path>`;
    });
    for (const n of leaf) {
      const b = lay.boxes.get(n.id); if (!b) continue;
      const real = n.id.startsWith("out:") ? n.id.slice(4) : n.id, blk = byId.get(real), o = ov(blk), inner = kidsV(real).length;
      const chars = Math.floor((b.w - 20) / 7);
      h += `<g class="bx" data-box="${esc(n.id)}"><title>${esc(real)}${inner ? " · double-click to open" : ""}</title><rect class="l${n.id.startsWith("out:") ? " out" : ""}" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="8"/>` +
        (o ? `<rect x="${b.x}" y="${b.y}" width="5" height="${b.h}" rx="2" style="fill:${vcolor(o.verdict)}"/>` : "") +
        `<text x="${b.x + 12}" y="${b.y + 21}">${esc(n.title.length > chars ? n.title.slice(0, chars - 1) + "…" : n.title)}</text>` +
        `<text class="tg" x="${b.x + 12}" y="${b.y + 40}">${esc(n.kind)}${blk.truth === "wired" ? " · wired" : ""}${inner && !n.id.startsWith("out:") ? " · ▸ " + inner : ""}</text>` +
        rollSvg(roll.get(n.id), b.x + 12, b.y + 59, true) + `</g>`;
    }
    document.getElementById("vp").innerHTML = h;
    bar();
    wire();
    fit();
    if (P.flow) showStep(true);
    marks();
  }

  function curve(p) { // ELK spline sections: start, (control, control, end)*; anything else as a polyline
    if (p.length >= 4 && (p.length - 1) % 3 === 0)
      return `M${p[0].x},${p[0].y}` + p.slice(1).map((q, j) => (j % 3 === 0 ? " C" : " ") + q.x + "," + q.y).join("");
    return p.map((q, j) => (j ? "L" : "M") + q.x + "," + q.y).join(" ");
  }
  function straight(a, b) { return a && b ? [{ x: a.x + a.w, y: a.y + a.h / 2 }, { x: b.x, y: b.y + b.h / 2 }] : null; }
  function rollSvg(m, x, y, fromLeft) { // verdict dots with counts, most severe first; right-aligned at x unless fromLeft
    if (!m) return "";
    const ks = Object.keys(m).sort((a, b) => (rank[a] ?? 9) - (rank[b] ?? 9));
    const w = k => String(m[k]).length * 6.6 + 18;
    let cx = fromLeft ? x : x - ks.reduce((t, k) => t + w(k), 0), out = "";
    for (const k of ks) {
      out += `<circle cx="${cx + 4}" cy="${y - 4}" r="4" style="fill:${vcolor(k)}"/><text class="tg" x="${cx + 11}" y="${y}">${m[k]}</text>`;
      cx += w(k);
    }
    return out;
  }

  function bar() {
    const el = document.getElementById("dbar");
    if (!el) return;
    const crumbs = [`<a data-root="">All</a>`];
    if (D.root) for (const a of [...anc(D.root)].reverse().concat(D.root)) crumbs.push(`<a data-root="${esc(a)}">${esc(title(a))}</a>`);
    let h = `<span class="crumbs">${crumbs.join(" › ")}</span><button data-act="fit">Fit</button>` +
      (D.exp.size ? `<button data-act="collapse">Collapse all</button>` : "") +
      `<details class="kinds"><summary>Edges${D.off.size ? ` (${edgeKinds.length - D.off.size} of ${edgeKinds.length})` : ""}</summary><div>` +
      edgeKinds.map(k => `<label><input type="checkbox" data-kind="${esc(k)}"${D.off.has(k) ? "" : " checked"}>${esc(k)}</label>`).join("") + `</div></details>` +
      (D.root ? `<label><input type="checkbox" data-act="outside"${D.outside ? " checked" : ""}>outside${D.hidden && !D.outside ? ` (${D.hidden} links hidden)` : ""}</label>` : "") +
      (D.note ? `<span class="n">${esc(D.note)}</span>` : "");
    if (P.flow) {
      const st = P.flow.steps[P.i];
      h += `<span class="play">${esc(P.flow.title || P.flow.id)} · step ${P.i + 1}/${P.flow.steps.length}: ${esc(st.kind)} ${esc(title(st.to))}${st.label ? " · " + esc(st.label) : ""}</span>` +
        `<button data-act="prev" aria-label="Previous step">◀</button><button data-act="next" aria-label="Next step">▶</button>` +
        `<button data-act="auto">${P.timer ? "Pause" : "Play"}</button><button data-act="stop" aria-label="Stop the flow">✕</button>`;
    }
    el.innerHTML = h;
  }

  function marks() {
    const vp = document.getElementById("vp");
    if (!vp || !D.nodes) return;
    const selBox = S.sel ? D.rep(S.sel) : null;
    const walk = new Set(), seen = new Set();
    let cur = null;
    if (P.flow) {
      for (let j = 0; j <= P.i; j++) { const r = D.rep(P.flow.steps[j].to); if (r) seen.add(r); }
      cur = D.rep(P.flow.steps[P.i].to);
      const prev = P.i > 0 ? D.rep(P.flow.steps[P.i - 1].to) : null;
      D.es.forEach((e, i) => { if (prev && ((e.from === prev && e.to === cur) || (e.from === cur && e.to === prev))) walk.add(i); });
    }
    vp.querySelectorAll(".bx").forEach(g => {
      const id = g.dataset.box;
      g.classList.toggle("sel", id === selBox);
      g.classList.toggle("cur", id === cur);
      g.classList.toggle("seen", seen.has(id) && id !== cur);
    });
    vp.querySelectorAll("path.e").forEach(p => {
      const e = D.es[+p.dataset.e];
      p.classList.toggle("hot", !!selBox && (e.from === selBox || e.to === selBox));
      p.classList.toggle("walk", walk.has(+p.dataset.e));
    });
  }

  function applyTf() { const vp = document.getElementById("vp"); if (vp) vp.setAttribute("transform", `translate(${D.tf.x},${D.tf.y}) scale(${D.tf.k})`); }
  function fit() {
    const svg = document.getElementById("dsvg"); if (!svg || !D.size) return;
    const r = svg.getBoundingClientRect(), top = (document.getElementById("dbar")?.offsetHeight || 0) + 10;
    const k = Math.min((r.width - 40) / (D.size.w || 1), (r.height - top - 20) / (D.size.h || 1), 1.2);
    D.tf = { k, x: (r.width - D.size.w * k) / 2, y: top + Math.max(0, (r.height - top - D.size.h * k) / 2) };
    applyTf();
  }
  function centerOn(id) { // pan (and zoom in if the boxes are tiny) so a box is in view
    const b = D.boxes.get(id), svg = document.getElementById("dsvg"); if (!b || !svg) return;
    const r = svg.getBoundingClientRect();
    if (D.tf.k < 0.6) { const k = 0.8; D.tf.x = r.width / 2 - (b.x + b.w / 2) * k; D.tf.y = r.height / 2 - (b.y + b.h / 2) * k; D.tf.k = k; applyTf(); return; }
    const sx = D.tf.x + (b.x + b.w / 2) * D.tf.k, sy = D.tf.y + (b.y + b.h / 2) * D.tf.k;
    if (sx < 40 || sy < 70 || sx > r.width - 40 || sy > r.height - 40) { D.tf.x += r.width / 2 - sx; D.tf.y += r.height / 2 - sy; applyTf(); }
  }

  function wire() {
    const svg = document.getElementById("dsvg");
    let drag = null;
    svg.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY, tx: D.tf.x, ty: D.tf.y, moved: false }; };
    svg.onpointermove = e => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) < 4) return;
      if (!drag.moved) { drag.moved = true; svg.setPointerCapture(e.pointerId); svg.classList.add("drag"); }
      D.tf.x = drag.tx + dx; D.tf.y = drag.ty + dy; applyTf();
    };
    svg.onpointerup = e => {
      const was = drag; drag = null; svg.classList.remove("drag");
      if (!was || was.moved) return;
      const g = e.target.closest(".bx");
      if (!g) return;
      const id = g.dataset.box, real = id.startsWith("out:") ? id.slice(4) : id;
      if (D.nodes.get(id)?.open && e.target.closest("text.ct")) { D.exp.delete(id); renderDiagram(); return; } // fold
      S.sel = real; renderTree(); renderDetail(); marks();
    };
    svg.ondblclick = e => { // open a box in place; for a box outside the root, move the root to its parent
      const g = e.target.closest(".bx");
      if (!g) return;
      const id = g.dataset.box, real = id.startsWith("out:") ? id.slice(4) : id;
      if (id.startsWith("out:")) { D.root = byId.get(real).parent || ""; D.exp = new Set([real]); }
      else if (kidsV(real).length && !D.nodes.get(id)?.open) D.exp.add(real);
      else return;
      renderDiagram();
    };
    svg.onwheel = e => {
      e.preventDefault();
      const r = svg.getBoundingClientRect(), cx = e.clientX - r.left, cy = e.clientY - r.top;
      const k = Math.max(0.05, Math.min(3, D.tf.k * Math.exp(-e.deltaY * 0.0015)));
      D.tf.x = cx - (cx - D.tf.x) * (k / D.tf.k); D.tf.y = cy - (cy - D.tf.y) * (k / D.tf.k); D.tf.k = k; applyTf();
    };
    const el = document.getElementById("dbar");
    el.onclick = e => {
      const r = e.target.closest("[data-root]");
      if (r) { D.root = r.dataset.root; D.exp = new Set(); renderDiagram(); return; }
      const a = e.target.closest("button[data-act]")?.dataset.act;
      if (a === "fit") fit();
      if (a === "collapse") { D.exp.clear(); renderDiagram(); }
      if (a === "prev" && P.i > 0) { P.i--; showStep(true); }
      if (a === "next") nextStep();
      if (a === "auto") { if (P.timer) { clearInterval(P.timer); P.timer = 0; } else P.timer = setInterval(nextStep, 1400); bar(); }
      if (a === "stop") stopPlay();
    };
    el.onchange = e => {
      if (e.target.dataset.act === "outside") { D.outside = e.target.checked; renderDiagram(); return; }
      const k = e.target.dataset.kind;
      if (k) { e.target.checked ? D.off.delete(k) : D.off.add(k); renderDiagram(); }
    };
  }

  async function reveal(id) { // show a block picked elsewhere: open its ancestors under the root, or move the root up
    if (D.root && id !== D.root && !anc(id).includes(D.root)) D.root = "";
    for (const a of anc(id)) if (a !== D.root && !anc(D.root || "").includes(a)) D.exp.add(a);
    await renderDiagram();
    marks();
    const r = D.rep && D.rep(id);
    if (r) centerOn(r);
  }

  function startPlay(id) {
    P.flow = flows.find(f => f.id === id); P.i = 0;
    S.tab = "diag";
    document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x.dataset.tab === "diag"));
    renderPane();
  }
  function nextStep() { if (P.flow && P.i < P.flow.steps.length - 1) { P.i++; showStep(true); } else if (P.timer) { clearInterval(P.timer); P.timer = 0; bar(); } }
  function showStep(move) {
    if (!P.flow) return;
    bar(); marks();
    const r = D.rep && D.rep(P.flow.steps[P.i].to);
    if (move && r) centerOn(r);
  }
  function stopPlay() { if (P.timer) clearInterval(P.timer); P.flow = null; P.timer = 0; bar(); marks(); }

  // ---- detail
  const detail = document.getElementById("detail");
  detail.onclick = e => {
    const f = e.target.closest("[data-focus]");
    if (f) { // drill in: the block's inside becomes the whole diagram
      D.root = f.dataset.focus; D.exp = new Set(); S.tab = "diag";
      document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x.dataset.tab === "diag"));
      renderPane(); return;
    }
    const a = e.target.closest("[data-id]"); if (a) select(a.dataset.id);
  };
  function renderDetail() {
    const b = byId.get(S.sel);
    if (!b) { detail.innerHTML = `<p class="empty">${blocks.length ? "No block selected." : "The graph is empty."}</p>`; return; }
    const crumbs = [];
    for (let p = b.parent; p && byId.has(p); p = byId.get(p).parent) crumbs.unshift(`<a data-id="${esc(p)}">${esc(title(p))}</a>`);
    const chips = [b.kind, b.tier, b.system && "system " + b.system, b.truth, b.initiative && "proposal " + b.initiative].filter(Boolean)
      .map(c => `<span class="chip">${esc(c)}</span>`).join("");
    let h = `<h2>${esc(b.title || b.id)}</h2><div class="id">${esc(b.id)}</div>` +
      (kidsV(b.id).length ? `<div class="crumbs"><a class="link" data-focus="${esc(b.id)}">focus in the diagram</a></div>` : "") +
      (crumbs.length ? `<div class="crumbs">${crumbs.join(" › ")}</div>` : "") + `<div class="chips">${chips}</div>` +
      (b.description ? `<p>${esc(b.description)}</p>` : "");
    const o = ov(b);
    if (o) {
      h += `<h3>Proposal verdict</h3><div class="verdict"><i class="dot" style="background:${vcolor(o.verdict)}"></i>${esc(o.title || o.verdict)}</div>` +
        (o.cases || []).map(c => `<div class="case"><span class="cls">${esc(c.class)}</span>${c.case ? ` · ${esc(c.case)}` : ""}` +
          (c.gaps?.length ? ` · gaps ${c.gaps.map(g => `<a class="link" data-id="init:${esc(S.init)}:gaps:${esc(g)}">${esc(g)}</a>`).join(", ")}` : "") +
          (c.requirement ? `<div>${esc(c.requirement)}</div>` : "") + (c.notes ? `<div class="n">${esc(c.notes)}</div>` : "") + `</div>`).join("");
    }
    const attrs = Object.entries(b.attrs || {});
    if (attrs.length) h += `<h3>Attributes</h3><table>` + attrs.map(([k, v]) => `<tr><td class="key">${esc(k)}</td><td>${esc(v)}</td></tr>`).join("") + `</table>`;
    h += `<h3>Provenance</h3><div class="id">${esc(b.provenance?.kind)} ${esc(b.provenance?.source || "")}</div>`;
    const ch = (kids.get(b.id) || []).filter(visible);
    if (ch.length) h += `<h3>Contains (${ch.length})</h3>` + ch.slice(0, 60).map(c => `<div><a class="link" data-id="${esc(c)}">${esc(title(c))}</a> <span class="n">${esc(byId.get(c).kind)}</span></div>`).join("") +
      (ch.length > 60 ? `<div class="n">+${ch.length - 60} more</div>` : "");
    detail.innerHTML = h;
  }

  renderTree(); renderPane(); renderDetail();
  window.addEventListener("resize", () => { if (S.tab === "rel") renderRelations(); });
})();
</script>
</body>
</html>
