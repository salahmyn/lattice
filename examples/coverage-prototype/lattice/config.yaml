# Lattice configuration for the coverage example (docs/rnd/0009).
mutation_testing:
  enabled: false

# Coverage of the suite and of each verifier test, as regen.sh writes it.
# The block's presence turns on VERIFIER_MISSES_ENFORCER, COVERAGE_STALE and
# VERIFIER_UNPROVEN; the floors turn on COVERAGE_BELOW_FLOOR.
coverage:
  reports:
    - path: coverage/all.lcov
      include: ["src/**"]       # node --test lists only loaded files
  per_test:
    only_verifiers: true
    dirs:
      - dir: coverage/per-test  # one LCOV per test, named by its slug
        include: ["src/**"]
  floors:
    feature: 50
    invariant: 80
    tier: {3: 90}

validate:
  # Tier-3 criteria (money) must be exercised: a verifier's own run executed
  # the guard. Everything else must be demonstrated.
  require_level: {default: demonstrated, tier: {3: exercised}}
  # The reachability codes are off until enabled here (the coverage: block
  # does not turn them on). The roots are the entry point's handler
  # (src.cli.main) and the trigger the database runs.
  severity:
    SYMBOL_UNREACHED: warning   # sql.public.debit_v1: nothing calls it
    SYMBOL_TEST_ONLY: info      # src.statement.formatStatement: only a test does
    SYMBOL_UNTESTED: info       # reached, but the suite did not run it
    UNUSED_EXPORT: info         # exported, imported by no other module
