name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # The PostgreSQL store contract runs only when LATTICE_TEST_PG_DSN is set.
      - run: go test ./...
      # Lattice describes its own codebase (lattice/, see docs/rnd/0008):
      # a broken link or an invariant left unenforced or unverified fails here.
      - run: go build -o dist/lattice ./cmd/lattice
      - run: dist/lattice extract && dist/lattice validate
