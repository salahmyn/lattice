name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            goarch: amd64
          - os: linux
            runner: ubuntu-latest
            goarch: arm64
          - os: darwin
            runner: macos-latest
            goarch: amd64
          - os: darwin
            runner: macos-latest
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache: true

      - name: Install build dependencies (Linux ARM64)
        if: matrix.os == 'linux' && matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.os == 'linux' && matrix.goarch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }}
        run: |
          output_name="lattice-${{ matrix.os }}-${{ matrix.goarch }}"
          go build -o "$output_name" -ldflags="-X github.com/salahmyn/lattice/internal/cli.Version=${GITHUB_REF#refs/tags/}" -v ./cmd/lattice
          echo "BUILD_OUTPUT=$output_name" >> $GITHUB_ENV

      - name: Create checksums
        run: |
          sha256sum "${{ env.BUILD_OUTPUT }}" > "${{ env.BUILD_OUTPUT }}.sha256"
          cat "${{ env.BUILD_OUTPUT }}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lattice-${{ matrix.os }}-${{ matrix.goarch }}
          path: |
            lattice-*
            *.sha256
          retention-days: 30

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache: true

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find release-artifacts -type f \( -name 'lattice-*' -o -name '*.sha256' \) ! -name coverage -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate release notes
        id: release_notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          echo "## Release: $TAG" > release_notes.md
          echo "" >> release_notes.md
          echo "### Download" >> release_notes.md
          echo "" >> release_notes.md
          echo "| Platform | Binary | SHA256 |" >> release_notes.md
          echo "|----------|--------|--------|" >> release_notes.md
          
          for binary in release-assets/lattice-*; do
            if [[ ! "$binary" =~ \.sha256$ ]]; then
              basename_only=$(basename "$binary")
              sha_file="$binary.sha256"
              if [ -f "$sha_file" ]; then
                sha_hash=$(cut -d' ' -f1 "$sha_file")
                sha_short=${sha_hash:0:16}
                echo "| $(echo $basename_only | sed 's/lattice-//') | \`$basename_only\` | \`$sha_short...\` |" >> release_notes.md
              fi
            fi
          done
          
          echo "" >> release_notes.md
          echo "### Changes" >> release_notes.md
          echo "" >> release_notes.md
          
          if [ -n "$PREVIOUS_TAG" ]; then
            git log "$PREVIOUS_TAG..$TAG" --oneline --pretty=format:"- %h: %s" >> release_notes.md || true
          else
            git log "$TAG" --oneline --pretty=format:"- %h: %s" | head -20 >> release_notes.md || true
          fi
          
          echo "" >> release_notes.md
          echo "### Checksums" >> release_notes.md
          echo "" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          cat release-artifacts/lattice-*/*.sha256 2>/dev/null >> release_notes.md || true
          echo "\`\`\`" >> release_notes.md
          
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/**/*
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify on Release
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Release Summary
        run: |
          echo "✅ Release ${{ github.ref }} completed successfully!"
          echo "📦 Binaries available at: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
