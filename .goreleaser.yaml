version: 2

project_name: lattice

before:
  hooks:
    - go mod tidy

builds:
  - id: lattice
    main: ./cmd/lattice
    binary: lattice
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/salahmyn/lattice/pkg/lattice/buildinfo.Version={{.Version}}
      - -X github.com/salahmyn/lattice/pkg/lattice/buildinfo.Commit={{.Commit}}
      - -X github.com/salahmyn/lattice/pkg/lattice/buildinfo.Date={{.Date}}

archives:
  - id: lattice
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true
