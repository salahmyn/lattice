id: check
version: 1
status: production
purpose: |
  The single check: one verdict for a change, from merge-base(base, HEAD) to the working
  tree. It finds the touched promises and lines with impact, reads their signals from the
  audit at head, compares them with the audit snapshot of the base, and says BROKEN,
  UNPROVEN or ASSURED, whether the change may merge, and the blind spot.
owners:
  business: lattice-maintainers
  engineering: lattice-core
implements_brd: brd.verification
invariants:
  - id: INV-1
    statement: Anything that fell reads BROKEN and never merges. That is a promise level dropped against base, an enforcer or verifier removed (except an enforcer moved under INV-14), a break killed at base that survives at head, a red suite, or an edit to the statement, tier or mapping of a confirmed promise.
    cases:
      - id: a
        kind: error
        statement: An enforcer removed reads BROKEN and never merges, unless the same change moved it under INV-14.
      - id: b
        kind: error
        statement: A verifier removed reads BROKEN and never merges.
      - id: c
        kind: error
        statement: A promise level dropped against base reads BROKEN and never merges.
      - id: d
        kind: error
        statement: A break killed at base that survives at head reads BROKEN and never merges.
      - id: e
        kind: error
        statement: A red suite reads BROKEN and never merges.
      - id: f
        kind: edge
        statement: An edit to the statement, tier or mapping of a confirmed promise reads BROKEN until a human confirms it again.
  - id: INV-2
    statement: Unknown is never a pass. A missing signal is a gap that keeps the verdict at UNPROVEN, each tier needs its default signals (tier 1 exercised or break_tested, tier 2 and 3 break_tested), and UNPROVEN is never drawn as a pass.
  - id: INV-3
    statement: An UNPROVEN change may merge only when no (promise, signal) pair gained a gap it did not have at base, the new untraced lines did not rise, and no tier-3 promise is involved; a waiver, including one added in the same change, never removes a gap from that comparison.
  - id: INV-4
    statement: With --ci, evidence not stamped with the head commit and a CI run is set aside and reads unknown (EVIDENCE_NOT_CI).
  - id: INV-5
    statement: A touched line counts as traced only when an enforcer span, a checked reference or an entry point that reaches it covers it; a file-level module tag alone never does, and such lines go in the blind spot.
  - id: INV-6
    statement: A change that edits a confirmed promise and carries a decision file approving, acking or confirming it at its new version is not a weakening; its confirmed gap is pending on the change's own human approval and does not block the merge, tier 3 included. Without the decision file the edit voids the confirmation.
  - id: INV-7
    statement: Missing evidence is never a fall. A promise whose head row reads not_demonstrated only because no result is ingested (no_results) is a gap that reads UNPROVEN, never BROKEN; a red result still falls.
  - id: INV-8
    statement: Evidence (results, coverage, breaks) stamped with a commit that is not HEAD is set aside in every run, local included, and reads unknown (EVIDENCE_STALE); it never counts as a pass, never reads ASSURED and never makes a fall. The base audit snapshot keeps its own rule.
  - id: INV-9
    statement: A touched production line that no promise guards (no enforcer span or checked reference covers it), including one only an entry point reaches, keeps the verdict at UNPROVEN (UNGUARDED_LINES) and is counted in the blind spot; it is reported and does not change merge_allowed. NOTHING_TOUCHED reads only when the change touches no promise and no production line.
  - id: INV-10
    statement: A break-based gap (break_tested, or exercised read through it) of a promise the change does not touch is not a new gap when no break run happened at head at all and the base had no gap on it; evidence not gathered is never a fall and never blocks a merge. A touched promise still needs a fresh run, and a survival or per-test coverage saying no still counts.
  - id: INV-11
    statement: An informational note on a touched promise, such as STATEMENT_UNCHANGED (an enforcer changed and its statement and tier did not), is shown on the promise's row and never changes the verdict, a gap or merge_allowed.
  - id: INV-12
    statement: Whether the working tree differs from HEAD is read by one rule everywhere, the dirty flag of check, audit, confirm, prepare and the web API and the uncommitted flag of impact alike. A modified, added or deleted path, or an untracked one git does not ignore, counts; Lattice's own runtime state never does, which is every lattice/.ledger/ and lattice/.cache/ and the workspace's own .ledger/ and .cache/ whatever its directory is called. A coverage ingest also leaves out the reports it reads.
  - id: INV-13
    statement: A touched line reads that an entry point reaches it only when the call graph reaches its symbol from the handler of a declared entry point, and a handler that names no symbol of the graph reaches nothing. A line whose feature is on an entry point's flow but that no handler reaches reads that weaker reason, a handler reach the graph cannot decide reads unknown and never reached, and none of these readings makes a line guarded.
  - id: INV-14
    statement: A base enforcer of a tier 1 or 2 promise that no longer enforces it at head reads ENFORCER_MOVED, not BROKEN, only when the same change adds an enforcer of that promise that did not enforce it at base. The move opens a (promise, break_tested) gap that is new at every tier and whatever the base read. It clears only when head break results show a killed break of each added enforcer; evidence on kept enforcers, a waiver and INV-10 never clear it. Anything else is ENFORCER_REMOVED.
