id: graph
version: 1
status: production
purpose: |
  Fuses manifests, BRDs and parsed source into the knowledge graph (lattice.json).
owners:
  business: lattice-maintainers
  engineering: lattice-core
implements_brd: brd.code_graph
invariants:
  - id: INV-1
    statement: Building the graph from the same inputs gives byte-identical output.
  - id: INV-2
    statement: A feature's children are its immediate dotted sub-features, and its implementations are the symbols attributed to it.
  - id: INV-3
    statement: A re-extract keeps the block graph a refresh wrote; an absent or unparseable graph carries nothing.
  - id: INV-4
    statement: A sharded graph loads back to the graph it was written from.
