id: graph
version: 1
status: production
purpose: |
  Fuses manifests, BRDs and parsed source into the knowledge graph (lattice.json).
owners:
  business: lattice-maintainers
  engineering: lattice-core
implements_brd: brd.code_graph
invariants:
  - id: INV-1
    statement: Building the graph from the same inputs gives byte-identical output.
  - id: INV-2
    statement: A feature's children are its immediate dotted sub-features, and its implementations are the symbols attributed to it.
  - id: INV-3
    statement: A re-extract keeps the block graph a refresh wrote; an absent or unparseable graph carries nothing.
  - id: INV-4
    statement: A sharded graph loads back to the graph it was written from.
  - id: INV-5
    statement: A verifier ref that names a case (f:INV-N#c) counts as a verifier of f:INV-N for every signal, and the graph keeps the case ref as written.
  - id: INV-6
    statement: A layer comes only from an adapter fact or a declared path rule; otherwise it is unknown.
  - id: INV-7
    statement: A writer of an invariant's columns that is neither its enforcer nor under a guard of it is reported.
  - id: INV-8
    statement: An invariant's declared columns, when present, are its columns exactly and its enforcers' writes are not used; a declared column that names no table or column the migrations leave is an error.
  - id: INV-9
    statement: Each ENFORCER_EXPOSED states whether the function body reads the caller's identity, citing the first read, or that it reads none; the finding fires either way.
  - id: INV-10
    statement: Each ENFORCER_EXPOSED states the identity the function reads directly or through a helper, the parameter it hashes to authenticate and its boolean parameters, each only when it holds; findings are ordered takes a boolean parameter and reads no identity, takes a boolean parameter, reads no identity and no hash, authenticates by a hash only, the rest, and stay info; the order is carried by the finding's rank and holds in every output, across files.
  - id: INV-11
    statement: Without declared columns, an invariant's columns are the columns its enforcers read in a condition on a table they write; an enforcer with no known condition read falls back to the columns it writes, never to an empty set, and the source is stated as conditions, writes or declared.
  - id: INV-12
    statement: An enforcer that writes nothing contributes its condition reads on any table to its invariant's columns, and one that writes only those on the tables it writes; either way the source is stated as columns from conditions.
  - id: INV-13
    statement: A column every condition read of which compares it with the caller's identity (auth.uid(), a variable assigned only from it, or a function of the workspace that reads it) is a column of ownership; it links only the writers that UPDATE it, also by ON CONFLICT DO UPDATE and MERGE ... UPDATE, and an INSERT writer links only through the invariant's other columns; the finding and lattice writers name it as ownership.
  - id: INV-14
    statement: A read-only enforcer with a guard clause (an IF or ELSIF whose branch raises or returns before the end of the body) contributes only the columns its guard reads; when the guard reads no column the invariant says it ties no column to its writers, as an info finding, and never reads as an empty pass; an enforcer with no guard clause, and one that writes, keep their rule.
  - id: INV-15
    statement: Each column an UNGUARDED_WRITER or lattice writers links a writer through, when not declared, names every enforcer it came from with its file and line, and how (read in a condition, compared with the caller's identity, or written when the enforcer had no condition read); a finding lists at most three and says how many more, and --json lists them all; declared columns carry none.
  - id: INV-16
    statement: When a read-only enforcer's guard adds no column, the finding states why for that enforcer, never more than the code shows; it names a value loaded by EXECUTE of a string as unreadable, and otherwise says the guard reads no column Lattice can place on a table.
