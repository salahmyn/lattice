id: ui
version: 1
status: production
purpose: |
  The local web UI and JSON API over the knowledge graph.
owners:
  business: lattice-maintainers
  engineering: lattice-core
implements_brd: brd.adoption
invariants:
  - id: INV-1
    statement: A loopback-bound server refuses a request whose Host is not a loopback name.
  - id: INV-2
    statement: The block map colours a block only by the weakest audit class, in the audit's own order, of the promises it holds; a promise the audit has no row for reads unknown, and only the audit's positive classes are drawn as a pass.
  - id: INV-3
    statement: serve reuses a computed knowledge graph and audit only while the fingerprint of every input they read is unchanged; any change, or any error computing the fingerprint, computes them again.
  - id: INV-4
    statement: The block map never loads code from the network; an exported map carries its layout library inline and serve serves it from the binary, so both lay out offline.
  - id: INV-5
    statement: The server-rendered pages load no script, stylesheet or font from another origin; serve serves every one of them from the binary, so the pages render offline.
  - id: INV-6
    statement: The served block map shows a live loading status while its graph loads and an error with a retry when the load fails, and no status once the graph is drawn; an exported map, whose graph is inline, never shows it.
