id: confirm
version: 1
status: production
purpose: |
  Human confirmation. `lattice prepare` validates a decision against the kernel and writes a
  decision branch without touching the checkout; `lattice confirm` computes CONFIRMED from the
  platform's approving review on the merged pull request. Only a human other than the author
  confirms, and the audit's confirmed signal reads that result and nothing else.
owners:
  business: lattice-maintainers
  engineering: lattice-core
invariants:
  - id: INV-1
    statement: A decision counts only when the platform shows an approving review from a user other than the pull request's author, who is not a bot or an agent.
  - id: INV-2
    statement: The approving review must be on the head that was merged; an approval of an earlier head, a later change request or dismissal, or a comment is not an approval.
  - id: INV-3
    statement: A decision whose packet hash no longer matches its BRD version, promises and structural diff reads stale, and the hash ignores run-dependent signals so a better test run never voids a confirmation.
  - id: INV-4
    statement: Unknown is never confirmed. No platform token, no cache, or an unreadable platform reads unknown or pending, and an offline run reads the cache only.
  - id: INV-5
    statement: Prepare builds the decision branch with git plumbing from HEAD and never switches the checkout, touches the index or working tree, pushes or opens a pull request; the kernel refuses with a code when a rule is broken.
  - id: INV-6
    statement: confirm.json is read as confirmed only when its stamp is intact. A file with no stamp, a digest that does not match its records, commit or CI run, or one tracked by git reads unknown; under --ci a file of a local run or of another commit reads unknown; and a CI run never reuses a local file's verdicts.
  - id: INV-7
    statement: A decision file is never overwritten. Its name carries the first 8 digits of its packet hash, so preparing the same packet again reports the existing branch, a changed packet gets a new branch and file, and a same-named branch or file holding something else is refused; readers accept both the old and the new names.
  - id: INV-8
    statement: The packet hashes a BRD's scope, implements_via together with the features that name the BRD in implements_brd, so completing a one-sided link keeps the hash while a feature entering or leaving the scope changes it; a decision pinned before scope hashing still matches a BRD left as it was.
  - id: INV-9
    statement: A signature counts only from an sk- key type with user presence; any other key reads SOFTWARE_KEY.
  - id: INV-10
    statement: The signed message, never stored, holds repository, id, version, action, packet hash and rows in namespace lattice-decision; an incomplete tuple, another tuple or namespace fails.
  - id: INV-11
    statement: The key must be in allowed_signers for the login at the base commit, the first parent of the default-branch commit adding the signature, and at the tip.
  - id: INV-12
    statement: The key must be among the login's GitHub signing keys, asked each run; an unreadable platform reads unknown.
  - id: INV-13
    statement: Readers re-verify a signature verdict from the repository, taking only the signing-key fact from confirm.json; a failing claim reads unknown.
  - id: INV-14
    statement: lattice sign refuses without a terminal, under CI, for an agent or a non-sk key, and no MCP tool or skill offers it.
  - id: INV-15
    statement: A human verdict always shows its method, signed (login, fingerprint) or approved on a pull request.
  - id: INV-16
    statement: A promise's acceptance cases are part of its packet, so adding, editing or retiring one after confirmation makes the decision stale, while a promise with no cases hashes as it did before cases existed.
  - id: INV-17
    statement: A change to allowed_signers that adds a signer counts only when an endorsement in the same commit, by an sk- key trusted before the change, covers it; the first allowed_signers is the root, accepted and reported as ROOT_SIGNERS; a removal needs nothing; a key added otherwise reads SIGNER_NOT_ENDORSED, unknown.
  - id: INV-18
    statement: A signature verdict names a human login as its signer, never a bot or agent login, whoever opened the pull request; a pull request opened by a bot or agent account is named in the verdict's text.
  - id: INV-19
    statement: confirm --unsigned lists the current decisions that rest on a local note or a review, with the exact commands that re-confirm each by signature, and signs, prepares and writes nothing.
  - id: INV-20
    statement: Each acceptance case has its own confirmation state, read from the cases the confirming decision recorded, and the promise's confirmed signal keeps its meaning.
    cases:
      - id: a
        kind: happy
        statement: A case the confirming decision did not hold reads unconfirmed, added after confirmation.
      - id: b
        kind: edge
        statement: A case whose kind, statement or enforcer changed, or that was retired, since the decision recorded it reads unconfirmed and names the change.
      - id: c
        kind: happy
        statement: A case as the decision recorded it reads confirmed.
      - id: d
        kind: error
        statement: A decision that recorded no cases, or no confirmation at all, leaves every case unconfirmed with the reason.
  - id: INV-21
    statement: The review packet's structural diff names every acceptance case added, edited, retired or removed since the last confirmation recorded it, and any such line makes the review take full friction, while the packet hash stays the one a decision pins.
