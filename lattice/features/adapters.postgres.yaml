id: adapters.postgres
version: 1
status: production
purpose: |
  Reads PostgreSQL migrations and pgTAP tests, so rules enforced in the database are
  traced and demonstrated like application code.
owners:
  business: lattice-maintainers
  engineering: lattice-core
implements_brd: brd.code_graph
invariants:
  - id: INV-1
    statement: 'Migrations apply in filename order: the last create or replace is the effective definition and a drop removes the symbol.'
  - id: INV-2
    statement: A feature-qualified @enforces attributes the database symbol to that feature.
  - id: INV-3
    statement: An ALTER POLICY, ALTER FUNCTION or ALTER TRIGGER after the effective definition is recorded on its symbol in apply order (which parts it sets, and where), a rename gives the symbol its new name, and a later create or a drop discards the alterations before it.
  - id: INV-4
    statement: A named CHECK constraint, in a CREATE TABLE or an ALTER TABLE ... ADD CONSTRAINT, is a symbol sql.check.<schema>.<table>.<name> bound by the tag directly above its line, a CHECK with no name is never a symbol, and a drop, a re-add, a rename or a validate follow the effective-definition rules of policies.
  - id: INV-5
    statement: A function's EXECUTE privilege for a role is read only from statements the adapter parsed, in migration order; a role no statement names holds what PUBLIC holds, and one the adapter could not resolve is unknown, never closed.
  - id: INV-6
    statement: A SQL enforcer that a declared API role can execute is reported as ENFORCER_EXPOSED unless a security case naming it is verified; a privilege that is unknown, or API roles that are not declared, are reported as EXPOSURE_UNKNOWN; both are info.
  - id: INV-7
    statement: A table write is recorded only from DML the adapter parsed; a write it could not read makes the table's writer set incomplete, never empty.
  - id: INV-8
    statement: A function's caller-identity read is recorded only from code in its body, never from a comment, a string, or an argument default, and is absent when the body reads none.
  - id: INV-9
    statement: A function is recorded as authenticating by a hash only when a hash function applied to an expression that names one of its own parameters is compared to a name, with = in a WHERE, or with =, <>, !=, IS DISTINCT FROM or IS NOT DISTINCT FROM in an IF, ELSIF or CASE WHEN; a hash of a column or a literal, one that is only assigned or returned, and one in a comment or a string are not recorded.
  - id: INV-10
    statement: A function that reads no caller identity itself is recorded as reading it through a SQL function it calls only when that call resolves to a function of the workspace created once and that function reads it directly; no deeper call, builtin, unknown or overloaded name is followed.
  - id: INV-11
    statement: A parameter is recorded as boolean only when its declared type is boolean or bool; no name, default or other type is read for a meaning, and an output parameter is not one.
  - id: INV-12
    statement: A column a function reads in a condition is recorded only from the IF, ELSIF, CASE WHEN or WHERE text of its body (or a CHECK) that the adapter parsed, with the table it resolves to; a name it cannot place on a table is not recorded; the WHERE of a plain SELECT is read only in a function that writes nothing and has no unreadable write.
  - id: INV-13
    statement: A column compared by =, IN or = ANY in the WHERE of a function's own UPDATE, DELETE or SELECT ... INTO with a parameter, a field of a record variable declared in DECLARE (that is not a table alias of the body), or a hash function of a parameter is a row selector and is not recorded as a condition read; any other comparison of it still is.
  - id: INV-14
    statement: A table alias is bound within its own statement, so a name used as an alias of one table in one statement and of another in the next resolves in each to that statement's table; a name no statement of the reference binds is resolved only when every statement of the body agrees.
  - id: INV-15
    statement: A condition read is recorded as an ownership comparison only when one predicate, outside parentheses, compares a single column with auth.uid(), auth.jwt(), current_user or session_user (also as a sub-select or cast), a variable every assignment of which is one of these, or a function called with no arguments that is created once in the workspace and reads the identity itself; no deeper helper, other operator or other expression is one.
  - id: INV-16
    statement: A body has a guard clause only when an IF or ELSIF branch, at its own level, raises (RAISE EXCEPTION, or RAISE with no level) or returns (not RETURN NEXT) with more of the body after the whole IF for a return; a notice, a raise or return only in a nested branch, and a return that ends the body are not, and the reads in the condition of a guard branch carry a guard mark.
