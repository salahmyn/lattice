id: adapters.postgres
version: 1
status: production
purpose: |
  Reads PostgreSQL migrations and pgTAP tests, so rules enforced in the database are
  traced and demonstrated like application code.
owners:
  business: lattice-maintainers
  engineering: lattice-core
implements_brd: brd.code_graph
invariants:
  - id: INV-1
    statement: 'Migrations apply in filename order: the last create or replace is the effective definition and a drop removes the symbol.'
  - id: INV-2
    statement: A feature-qualified @enforces attributes the database symbol to that feature.
