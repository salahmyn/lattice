id: impact
version: 1
status: production
purpose: |
  A read-only change-impact report for a pull request: the symbols a change touches,
  the grounded criteria above their enforcers, enforcement it removes, and the
  manifest fields it changes.
owners:
  business: lattice-maintainers
  engineering: lattice-core
implements_brd: brd.intent
invariants:
  - id: INV-1
    statement: lattice impact writes nothing; the ledger, the flags, every tracked file and git's index are unchanged after a run.
  - id: INV-2
    statement: A symbol counts as changed only when a changed hunk overlaps its own lines and its text differs; a symbol that only shifted or moved is not changed.
  - id: INV-3
    statement: An enforcer that stops enforcing its invariant is reported, including a dropped @enforces tag on a symbol whose own lines are unchanged.
  - id: INV-4
    statement: The manifest diff names every changed field the schema has, matching list items by their id.
  - id: INV-5
    statement: When an enforcer's own lines change and its invariant's statement and tier do not, the report carries a STATEMENT_UNCHANGED note for that invariant; a promise the change adds, an edited statement or tier, or a change to verifiers only gets no note.
  - id: INV-6
    statement: The test listing (lattice impact --tests, and tests in lattice check --json) names every verifier of each touched promise, a changed verifier file included, grouped by the first break.runners entry whose glob matches as lattice break groups them; a verifier no entry matches is listed as unmatched with a reason, never dropped, and nothing is run.
  - id: INV-7
    statement: For each touched production symbol no promise guards (no enforcer span or checked reference covers it), the test listing also selects the tests that exercise it on the strongest evidence available, labelled in each test's why as per-test coverage (coverage), else the static call graph (call_graph), else a test file beside it with the same base name (heuristic); a symbol none of them finds a test for is listed under uncovered with a reason, never dropped.
  - id: INV-8
    statement: When coverage, the call graph and the neighbour heuristic find no test for a touched production symbol no promise guards, the test listing selects, as hints, the detected test files that changed with its file in the change itself, or in min_commits commits of the bounded break.co_change window whose score, each shared commit adding 1/(the files it changes), reaches min_score (co_change), else those whose text names the symbol as a whole word, a compound name of four or more characters that is not a common one, or a literal route its file declares (mentions); each test's why names the shared commits or the mentioning line, the symbol is listed under hinted, and it is listed under uncovered only when no test is selected.
  - id: INV-9
    statement: The test listing names only test cases (a symbol tagged @verifies, a test-framework case, a Go TestXxx function or its subtest, a Python or PHP test method), never another symbol of a test file such as a helper, a fixture or a fake; a file that holds no test case is never hinted, and each hinted symbol lists its tests' files.
  - id: INV-10
    statement: The report names each acceptance case whose own enforcer, or a test tagged with it, changed; another enforcer of the invariant touches no case.
