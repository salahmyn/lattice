id: entrypoints
version: 1
status: production
purpose: |
  Entry points, the invocation axis: HTTP routes, CLI commands, jobs and consumers,
  detected or persisted, with the features each reaches.
owners:
  business: lattice-maintainers
  engineering: lattice-core
implements_brd: brd.code_graph
invariants:
  - id: INV-1
    statement: A persisted entry point wins over a detected one with the same id; the detector only fills what the persisted one leaves empty.
  - id: INV-2
    statement: An entry-point file that cannot be used (a YAML error, no id) is reported with its line, never silently dropped.
  - id: INV-3
    statement: A rejected entry point is archived and no longer contributes to the graph.
  - id: INV-4
    statement: Laravel route groups and mounts prefix the routes they contain.
