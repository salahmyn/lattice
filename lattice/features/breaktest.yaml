id: breaktest
version: 1
status: production
purpose: |
  Breaks each promise's enforcer on a throwaway worktree and runs only that promise's
  verifiers, so a verifier that cannot tell the code is broken is found.
owners:
  business: lattice-maintainers
  engineering: lattice-core
implements_brd: brd.verification
invariants:
  - id: INV-1
    statement: A generated break only inserts an early return at the top of the enforcer's body (for SQL, an always-true policy or never-true trigger condition instead), and a language or symbol kind with no generator gets no break.
  - id: INV-2
    statement: Breaks are made and tested on a temporary worktree at HEAD, which is always removed; the working tree is never edited, and a dirty tree is refused unless allowed.
  - id: INV-3
    statement: A break that does not compile (only an explicit build marker or a runner exit of 125 counts, a runtime failure is a failing test), a baseline that fails or runs no test, a timeout or a missing runner reads unknown, never killed or survived.
  - id: INV-4
    statement: Verifiers that pass before and after the break read survived if every one ran, else unknown; those that pass before and fail after read killed.
  - id: INV-5
    statement: An earlier outcome is reused only when the enforcer, verifier, method, script and runner-configuration hashes all match, and unknown outcomes are never reused.
  - id: INV-6
    statement: A promise's verifiers are grouped by test runner (the first break.runners glob that matches, then the language template, then Go) and every group runs; the promise is killed only when a group fails after the break and every group passed at baseline.
  - id: INV-7
    statement: Each run records the verifiers that ran both times, the others (no runner, no test selected or run) and the tests that failed; a baseline that executes no test reads unknown, never survived.
  - id: INV-8
    statement: The worktree is prepared before the first baseline (node_modules linked, break.setup run), and a setup that fails reads unknown for every run.
  - id: INV-9
    statement: A break report records dirty true whenever the working tree differs from HEAD (tracked changes or untracked files not ignored), with or without --allow-dirty; the workspace's own .ledger/ and .cache/, wherever it sits, never make it dirty.
  - id: INV-10
    statement: A fails-on-base run reads fails_on_base only for a new or changed verifier that passes at head and fails on the base commit's code with the head's test files on top, and passes_on_base only for one that runs and passes there; any other verifier reads unknown, never a pass.
  - id: INV-11
    statement: A case break (--promise <promise>#<case>) breaks the case's own enforcer, else each of the invariant's, against only the tests tagged with the case, and records its runs under the case ref so they count for the case's coverage and never for the promise's break signal.
  - id: INV-12
    statement: lattice break exits 1 with --fail-on when a shown run has a listed outcome, and its output says so when no shown break ran; without --fail-on the exit code does not depend on the outcomes.
  - id: INV-13
    statement: A baseline is reused only for an identical invocation on an identical tree, and never when it timed out or errored.
  - id: INV-14
    statement: A break run that executes runners holds an exclusive lock on the repository (lattice/.cache/results/break.lock, created with O_EXCL, holding its pid and start time) until it ends, a second run fails fast naming the holder, and a lock whose process is gone is reclaimed; a run that executes nothing takes no lock.
  - id: INV-15
    statement: For a SQL break the runner may name {patched_sql} and {original_sql}, files holding only the broken object's statement and the same statement unbroken (a policy or trigger preceded by its DROP ... IF EXISTS), the baseline gets the original for both, a command that names either for a break with no such statement does not run and reads unknown, and the temporary paths never enter a baseline key.
  - id: INV-16
    statement: A cached break outcome is reused only for the same enforcer, verifiers, break, runner configuration and inputs (by default, the same tree), and never over a baseline that failed at this tree.
