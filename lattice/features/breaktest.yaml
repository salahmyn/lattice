id: breaktest
version: 1
status: production
purpose: |
  Breaks each promise's enforcer on a throwaway worktree and runs only that promise's
  verifiers, so a verifier that cannot tell the code is broken is found.
owners:
  business: lattice-maintainers
  engineering: lattice-core
implements_brd: brd.verification
invariants:
  - id: INV-1
    statement: A generated break only inserts an early return at the top of the enforcer's body, and a language or symbol kind with no generator gets no break.
  - id: INV-2
    statement: Breaks are made and tested on a temporary worktree at HEAD, which is always removed; the working tree is never edited, and a dirty tree is refused unless allowed.
  - id: INV-3
    statement: A break that does not compile (only an explicit build marker counts, a runtime failure is a failing test), a baseline that fails or runs no test, a timeout or a missing runner reads unknown, never killed or survived.
  - id: INV-4
    statement: Verifiers that pass before and after the break read survived, and verifiers that pass before and fail after read killed.
  - id: INV-5
    statement: An earlier outcome is reused only when the enforcer, verifier, method, script and runner-configuration hashes all match, and unknown outcomes are never reused.
  - id: INV-6
    statement: A promise's verifiers are grouped by test runner (the first break.runners glob that matches, then the language template, then Go) and every group runs; the promise is killed only when a group fails after the break and every group passed at baseline.
  - id: INV-7
    statement: Each run records the verifiers that ran, the ones that did not (no runner, or no test selected) and the tests that failed; a baseline that executes no test reads unknown, never survived.
  - id: INV-8
    statement: The worktree is prepared before the first baseline (node_modules linked, break.setup run), and a setup that fails reads unknown for every run.
  - id: INV-9
    statement: A break report records dirty true whenever the working tree differs from HEAD (tracked changes or untracked files that are not ignored) outside the workspace's own .ledger/ and .cache/, with or without --allow-dirty; those Lattice-owned paths, wherever the workspace sits in the checkout, never make it dirty.
