id: cli
version: 1
status: production
purpose: |
  The lattice command line: one static binary whose JSON output is the contract the
  MCP server and agents consume.
owners:
  business: lattice-maintainers
  engineering: lattice-core
implements_brd: brd.adoption
invariants:
  - id: INV-1
    statement: Setting a top-level key of a record keeps its other keys and comments; a record that is not a mapping is refused.
  - id: INV-2
    statement: init leaves .gitignore ignoring the workspace's cache and derived graph, appending only the missing lines and never rewriting the user's.
  - id: INV-3
    statement: A build without link-time version flags reports the module version and the commit, time and modified state the Go toolchain embedded; values set at link time are never replaced.
  - id: INV-4
    statement: A preflight refuses break, runs-clean, demonstrate, or check with break.runners, before any step runs, exiting 2 with every problem found (code, config key, fix) when a declared executable, runner dir, Node minimum, Docker daemon or service is missing or unmet, or break's tree is dirty; --no-preflight skips it.
