id: validation
version: 1
status: production
purpose: |
  Checks the graph against Lattice's rules and reports findings with a next action,
  under the workspace's severity policy and allowlist.
owners:
  business: lattice-maintainers
  engineering: lattice-core
implements_brd: brd.verification
invariants:
  - id: INV-1
    statement: An invariant no symbol enforces is UNENFORCED_INVARIANT, and one no test verifies is UNVERIFIED_INVARIANT.
  - id: INV-2
    statement: A depends_on cycle is DEPENDS_ON_CYCLE.
  - id: INV-3
    statement: A feature id outside the dotted lowercase grammar is MANIFEST_ID_FORMAT.
  - id: INV-4
    statement: UNATTRIBUTED_MODULE is off unless the workspace turns it on.
  - id: INV-5
    statement: A severity override applies per code; off drops the finding and an unknown severity name is VALIDATE_POLICY.
  - id: INV-6
    statement: A run fails only on findings at or above the fail_on threshold; off is not a threshold.
  - id: INV-7
    statement: An allowlist with an unknown key is ALLOWLIST_SCHEMA, and an entry that matches no finding is ALLOWLIST_STALE.
  - id: INV-8
    statement: A BRD below the required truth level is BRD_BELOW_LEVEL.
  - id: INV-9
    statement: An invariant whose enforcers are all non-guard symbols is ENFORCER_NOT_GUARD.
  - id: INV-10
    statement: FILE_LINE_CAP and METHOD_LINE_CAP apply only with ama_mode or an explicit cap, and never to test files.
  - id: INV-11
    statement: The coverage codes are off unless the workspace has a coverage block or sets their severity, and a declared floor turns on COVERAGE_BELOW_FLOOR.
  - id: INV-12
    statement: require_level accepts a level per criterion tier, and a criterion must reach the level of its tier.
  - id: INV-13
    statement: A tracked derived graph is GRAPH_TRACKED and tracked cache files are CACHE_TRACKED, and without git data neither fires.
  - id: INV-14
    statement: A case that is malformed, a verifier ref to a case that does not exist, and a case enforcer that does not enforce the case's invariant are errors; a verifier ref to a retired case is a warning.
    cases:
      - id: a
        kind: error
        statement: A case whose id is not lowercase letters or repeats another, whose kind is not happy, edge, error or security, or whose statement is empty is an error.
      - id: b
        kind: error
        statement: A verifier ref to a case its invariant does not declare is ORPHAN_ANNOTATION_CASE.
      - id: c
        kind: edge
        statement: A verifier ref to a retired case is CASE_RETIRED_VERIFIED, a warning.
      - id: d
        kind: error
        statement: A case enforcer that is not a symbol enforcing the case's invariant is CASE_ENFORCER_UNKNOWN.
  - id: INV-15
    statement: INVARIANT_BROAD is an info finding, raised only on an invariant with no cases whose statement reads as several claims.
  - id: INV-16
    statement: An invariant with a red verifier in the results of the graph's commit, or of a commit whose tree differs from it only in Lattice's own ledger and cache, is VERIFIER_FAILING whether or not a BRD criterion maps it, and a criterion that reports the same invariant names its failing tests instead.
  - id: INV-17
    statement: Validate names ingested results that are of another commit than the graph's (RESULTS_STALE, info by default) and never lets them change a level; a commit that git shows differs only in Lattice's own ledger and cache is not another, and one git cannot compare is.
  - id: INV-18
    statement: INVARIANT_UNREQUIRED is raised once per feature for every declared invariant, with or without a block, that no criterion of any BRD maps, says it is mapped by no criterion, and an allowlist entry accepts one feature:INV at a time.
  - id: INV-19
    statement: STATUS_DRIFT is raised for a proposal or accepted feature that the flow of a production entry point names, and for nothing else; root reach, a demonstrated criterion and a non-production entry point never raise it.
  - id: INV-20
    statement: FEATURE_UNREACHED also covers a proposal or accepted feature that has non-test code in the graph and is on no flow and reached by no root, states its status, and leaves the message for a production feature unchanged.
  - id: INV-21
    statement: INVARIANT_UNREQUIRED, STATUS_DRIFT and the findings of FEATURE_UNREACHED for unpromoted features are info and always on, so a run that fails on warnings stays green with all of them present.
  - id: INV-22
    statement: CRITERION_TIER_UNSET is an info finding, always on, one per BRD listing every criterion whose tier is not 1, 2 or 3; it never suggests a tier.
  - id: INV-23
    statement: BREAK_SURVIVED is raised once per feature for the break-tested promises whose break survived with every verifier run, naming each promise, enforcer and method, and BREAK_UNKNOWN_CAUSE once per feature for its unknown runs grouped by cause with a count and the reason text; both are info and always on, and neither changes a status, a level or a gate.
  - id: INV-24
    statement: A breaks.json that is missing, of another schema or of another commit than the graph reads as "no break evidence", raised once as BREAK_UNKNOWN_CAUSE (info); it is never counted as a pass and raises no per-feature finding.
  - id: INV-25
    statement: PROPOSAL_REACHED_BY_ROOT is an info finding, always on, one per proposal or accepted feature that no production entry-point flow names and that a non-test root reaches by the call graph FEATURE_UNREACHED reads; it names the roots and a reached symbol, says "reachable in code", and never fires for a production or deprecated feature or one STATUS_DRIFT reports.
