id: blocks
version: 1
status: production
purpose: |
  The recursive block graph built from flow catalogues, judgments and evidence.
owners:
  business: lattice-maintainers
  engineering: lattice-core
implements_brd: brd.code_graph
invariants:
  - id: INV-1
    statement: Building the block graph from the same inputs gives identical output.
  - id: INV-2
    statement: Reading a source at a git ref reads the committed tree, not the working tree.
  - id: INV-3
    statement: A block id declared in two catalogue files is an error naming the first file.
  - id: INV-4
    statement: Every feature and invariant becomes a block, and a dotted feature sits in the block of its id's prefix, or in a group block for the prefix when no feature declares it.
  - id: INV-5
    statement: A block edge's truth is declared when a human record or a judgment states it and is empty when no rule computes it; it is wired only when both ends were extracted from code and their keys are equal, and empty is never read as a pass.
