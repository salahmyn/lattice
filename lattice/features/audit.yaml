id: audit
version: 1
status: production
purpose: |
  The assurance audit: one row per invariant, saying whether there is evidence the
  promise is kept or it only looks done. It joins the ladder, per-test coverage,
  reach, break outcomes and the BRD approval record, and classifies each row as
  fake, break_tested, exercised, demonstrated_only, a gap, or unknown.
owners:
  business: lattice-maintainers
  engineering: lattice-core
implements_brd: brd.verification
invariants:
  - id: INV-1
    statement: Every invariant gets exactly one class, chosen in the order fake, break_tested, exercised, demonstrated_only, a gap, unknown; a second reader's note is shown and never changes the class.
  - id: INV-2
    statement: Unknown is never a pass and never fake. Missing per-test coverage or break runs read unknown, and only break_tested and exercised are drawn positive.
  - id: INV-3
    statement: A break run that survived on any enforcer with every verifier run reads passes_when_broken; one that survived while a verifier did not run reads unknown (partial_run), never fake; and one that killed, with no such survivor, reads break_tested.
  - id: INV-4
    statement: A breaks file of another commit, or of a schema the audit does not know, is set aside and never counted.
  - id: INV-5
    statement: The confirmed signal is read from the BRD approval record as human, agent, draft or drifted, and the least confirmed BRD behind a promise decides.
  - id: INV-6
    statement: Each row lists every enforcer of the promise with what breaking it did (killed, survived, unknown or not_run), read from its break runs; the list never changes the class, and the reason of a row decided by breaks names how many enforcers survived and which.
  - id: INV-7
    statement: The --promise, --feature and --class filters only narrow the rows shown, never the computation or a row's class; an unknown promise id is a usage error.
  - id: INV-8
    statement: Each acceptance case of an invariant gets a coverage the audit computes from ingested results and break runs, never a typed one, and unknown evidence never reads covered.
    cases:
      - id: a
        kind: happy
        statement: A case is covered when a verifier tagged with it passed and breaking its enforcer, the case's own or else the invariant's, made that verifier fail.
      - id: b
        kind: edge
        statement: A case is partial when a tagged verifier passed but no break run of its enforcer shows the verifier fail.
      - id: c
        kind: error
        statement: A case is failing when a tagged verifier's ingested result is red.
      - id: d
        kind: edge
        statement: A case is uncovered when no verifier is tagged with it, or no tagged verifier has a result.
  - id: INV-9
    statement: The results and coverage inputs match head when their commit stamp is head's, either side is unknown, or git shows the two commits differ only in Lattice's own ledger and cache (for coverage, only when it was ingested from a clean tree); another commit that git cannot compare with head never matches.
  - id: INV-10
    statement: A line counts as reached by an invariant's verifiers only from the coverage of an invocation that ran those verifiers (or a verifier's own per-test run), and a line with no such data is unknown, never run, verified or counted toward a floor.
  - id: INV-11
    statement: A killed break counts as proven through an entry point only when a verifier that killed it ran a way in that reaches the enforcer (its own per-test run, or the line data of its unshared verifier group); a static path alone is never proof, it only reads unknown, and only a complete static graph in which no killer reaches a way in reads none, which raises BREAK_NO_ENTRYPOINT (info).
