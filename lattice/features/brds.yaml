id: brds
version: 2
status: production
purpose: |
  Business Requirements Documents: the business intent above features, linked down
  by implements_via and up by implements_brd.
owners:
  business: lattice-maintainers
  engineering: lattice-core
implements_brd: brd.intent
invariants:
  - id: INV-1
    statement: A BRD whose implements_via names a missing feature is BRD_PHANTOM_FEATURE.
  - id: INV-2
    statement: An llm_from_code BRD that is not approved is BRD_UNAPPROVED_LLM.
  - id: INV-3
    statement: A BRD edited after its approved version is BRD_DRIFT.
  - id: INV-4
    statement: A BRD id must start with brd. and follow the dotted id grammar.
  - id: INV-5
    statement: A criterion that maps to an invariant its feature does not declare is BRD_CRITERION_PHANTOM_INVARIANT.
  - id: INV-6
    statement: A BRD's features are the union of its implements_via and the features that name it in implements_brd.
  - id: INV-7
    statement: A machine-written draft BRD (regenerated from code by an LLM, or authored by an agent) needs human review.
  - id: INV-8
    statement: A BRD and a feature that disagree about their link (implements_via without implements_brd, or the reverse) raise BRD_LINK_ONE_SIDED.
  - id: INV-9
    statement: A machine-written draft BRD whose current version a human confirmed on the platform (confirm.json) is not BRD_UNAPPROVED_LLM, and a typed approved_by never makes it so.
  - id: INV-10
    statement: brd link keeps a BRD's version when it completes a half the other side already declares, so the approval stands; when it adds a feature to a reviewed BRD's scope, or takes one out of it, it bumps that BRD's version.
  - id: INV-11
    statement: A BRD source with an unknown kind, an empty ref or a url that is not absolute http(s) is BRD_SOURCE_INVALID, and one whose checked_by and checked_at are not set together, or whose checked_at is not a date or is in the future, is BRD_SOURCE_CHECK_INVALID. The check never fetches a URL or sets a checked mark.
  - id: INV-12
    statement: A BRD regenerated from code may draft sources but never carries checked_by or checked_at.
