id: adapters
version: 1
status: production
purpose: |
  The language-adapter contract and registry. Every language concern sits behind one
  interface; the core dispatches each file to the adapter that owns its extension
  and never imports a parser.
owners:
  business: lattice-maintainers
  engineering: lattice-core
implements_brd: brd.code_graph
invariants:
  - id: INV-1
    statement: A path under a test directory (tests/, __tests__/, e2e/, testdata/, ...), an end-to-end file or a test-support module is test code.
  - id: INV-2
    statement: The registry hands a file to the enabled adapter that owns its extension; a disabled adapter handles nothing.
