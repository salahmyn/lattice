id: ep.cli.patch
version: 1
status: production
kind: cli
purpose: "Apply a typed patch to a manifest, initiative, or task"
owners:
  business: lattice-maintainers
  engineering: lattice-core
trigger:
  command: "lattice patch"
handler:
  symbol: internal.cli.newPatchCommand
  file: internal/cli/patch.go
flow:
  - feature: cli
  - feature: patch
