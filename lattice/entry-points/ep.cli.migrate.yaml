id: ep.cli.migrate
version: 1
status: production
kind: cli
purpose: Migrate a v0.1.0 flat-layout repository into the lattice/ directory
owners:
  business: lattice-maintainers
  engineering: lattice-core
trigger:
  command: lattice migrate
handler:
  symbol: internal.cli.newMigrateCommand
  file: internal/cli/migrate.go
flow:
  - feature: cli
  - feature: workspace
