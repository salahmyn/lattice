id: ep.cli.init
version: 1
status: production
kind: cli
purpose: Scaffold a Lattice workspace (with interactive wizard)
owners:
  business: lattice-maintainers
  engineering: lattice-core
trigger:
  command: lattice init
handler:
  symbol: internal.cli.newInitCommand
  file: internal/cli/initcmd.go
flow:
  - feature: cli
  - feature: onboarding
  - feature: workspace
  - feature: skills
