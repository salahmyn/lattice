id: ep.cli.confirm
version: 1
status: production
kind: cli
purpose: Compute which decisions a human confirmed, from the platform's approvals or a security-key signature
owners:
  business: lattice-maintainers
  engineering: lattice-core
trigger:
  command: lattice confirm
handler:
  symbol: internal.cli.newConfirmCommand
  file: internal/cli/confirm.go
flow:
  - feature: cli
  - feature: confirm
  - feature: audit
  - feature: brds
  - feature: results
