id: ep.cli.feature
version: 1
status: production
kind: cli
purpose: Inspect features
owners:
  business: lattice-maintainers
  engineering: lattice-core
trigger:
  command: lattice feature
handler:
  symbol: internal.cli.newFeatureCommand
  file: internal/cli/feature.go
flow:
  - feature: cli
  - feature: graph
